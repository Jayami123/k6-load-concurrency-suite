# Gitleaks configuration for the evidence release scan (.github/workflows/evidence-release.yml).
# The default ruleset stays on. The one allowlist entry below is deliberately narrow.

title = "k6-load-concurrency-suite evidence scan"

[extend]
useDefault = true

# Medusa publishable API keys are public by design: the storefront sends them from the browser, and the local harness stack
# generates a new one each time it starts. The Medusa LOAD runs write that key into their k6 case config, in the field
# `publishableKey`. This entry lets exactly that field pass: a `pk_` key of 64 lowercase hex digits, in the k6-config.json of a
# Medusa LOAD attempt folder. Any other field, any other value, any other file, and any other path still fails the scan.
[[allowlists]]
description = "Medusa publishable key (public by design, generated by the local harness) in a Medusa LOAD attempt k6-config.json"
targetRules = ["generic-api-key"]
condition = "AND"
paths = ['''load-medusa/P6-MED-LOAD-[0-9]{3}/[^/]+/k6-config\.json$''']
regexes = ['''^pk_[0-9a-f]{64}$''']
regexTarget = "secret"
