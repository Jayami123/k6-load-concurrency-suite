        if: ${{ !cancelled() && steps.token_scan.outcome == 'success' }}
        timeout-minutes: 3
        with:
          name: steady-medusa
          path: ${{ env.P6_WORKING_DIRECTORY }}/stage/
          if-no-files-found: warn
          retention-days: 90

      - name: Stop Medusa (harness down)
        if: ${{ always() }}
