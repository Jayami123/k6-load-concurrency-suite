          path: ${{ env.P6_WORKING_DIRECTORY }}/results/load/
          if-no-files-found: warn
          retention-days: 90

      - name: Stop Cal (harness down)
        if: ${{ always() }}
        timeout-minutes: 1
        working-directory: ${{ env.P6_WORKING_DIRECTORY }}
        run: |
          set -euo pipefail
          npm run down:cal || true

  medusa-spike:
    name: medusa-spike
    if: ${{ inputs.mode == 'spike' }}
    runs-on: ubuntu-24.04
    timeout-minutes: 60
    env:
      P6_WORKING_DIRECTORY: p6
      PRODUCTS_ROOT: ${{ github.workspace }}/products
      MEDUSA_CHECKOUT_PATH: products/medusa-dtc-starter
      MEDUSA_BASE_URL: http://127.0.0.1:9000
      # Public harness default database URL, not a secret.
      MEDUSA_DB_URL: postgres://medusa:medusa@127.0.0.1:5433/medusa
      MEDUSA_ADMIN_EMAIL: admin@qa.local
      MEDUSA_SKIP_STOREFRONT: "1"
      PLAYWRIGHT_SKIP_BROWSER_DOWNLOAD: "1"
      COREPACK_ENABLE_STRICT: "0"
    steps:
      # (3) The ref guard, first. Same text as evidence-release.yml; the release requires headBranch main.
      - name: Stop unless dispatched from main
        timeout-minutes: 1
        env:
          DISPATCH_REF: ${{ github.ref }}
        run: |
          set -euo pipefail
          [[ "$DISPATCH_REF" == "refs/heads/main" ]] \
            || { echo "::error::knee runs must be dispatched from main, not from $DISPATCH_REF"; exit 1; }
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        timeout-minutes: 1
        with:
          persist-credentials: false
          path: ${{ env.P6_WORKING_DIRECTORY }}

      - name: Checkout Medusa fork
        timeout-minutes: 1
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          repository: Jayami123/medusa-dtc-starter
          ref: ${{ env.MEDUSA_REF }}
          path: ${{ env.MEDUSA_CHECKOUT_PATH }}
          persist-credentials: false

      - name: Verify Medusa fork HEAD
        timeout-minutes: 1
        run: |
          set -euo pipefail
          head="$(git -C "${MEDUSA_CHECKOUT_PATH}" rev-parse HEAD)"
          if [ "$head" != "${MEDUSA_REF}" ]; then
            echo "::error::Medusa HEAD ${head} does not match MEDUSA_REF ${MEDUSA_REF}"
            exit 1
          fi

      - name: Stub harness product roots
        timeout-minutes: 1
        run: |
          set -euo pipefail
          mkdir -p "${PRODUCTS_ROOT}/cal" "${PRODUCTS_ROOT}/documenso" "${PRODUCTS_ROOT}/twenty-CRM"

      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        timeout-minutes: 1
        with:
          node-version-file: ${{ env.P6_WORKING_DIRECTORY }}/.nvmrc
          cache: npm
          cache-dependency-path: ${{ env.P6_WORKING_DIRECTORY }}/package-lock.json

      - name: Install P6 dependencies
        timeout-minutes: 1
        working-directory: ${{ env.P6_WORKING_DIRECTORY }}
        run: |
          set -euo pipefail
          npm ci

      - name: Install k6 (pinned in .k6-version, checksum-verified)
        timeout-minutes: 2
        run: |
          set -euo pipefail
          bash "${{ github.workspace }}/p6/scripts/install-k6.sh"

      - name: Enable pnpm via corepack
        timeout-minutes: 1
        run: |
          set -euo pipefail
          corepack enable
          corepack prepare pnpm@10.11.1 --activate
          version="$(pnpm --version)"
          if [ "$version" != "10.11.1" ]; then
            echo "::error::pnpm ${version} is not the 10.11.1 the Medusa fork pins"
            exit 1
          fi
          echo "PNPM_STORE_PATH=$(pnpm store path --silent)" >> "$GITHUB_ENV"

      - name: Restore pnpm store cache
        timeout-minutes: 1
        id: medusa_pnpm
        uses: actions/cache/restore@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
        with:
          path: ${{ env.PNPM_STORE_PATH }}
          key: ${{ runner.os }}-medusa-pnpm-${{ env.MEDUSA_REF }}-${{ hashFiles(format('{0}/pnpm-lock.yaml', env.MEDUSA_CHECKOUT_PATH)) }}

      - name: Install Medusa dependencies
        timeout-minutes: 1
        working-directory: ${{ env.MEDUSA_CHECKOUT_PATH }}
        run: |
          set -euo pipefail
          pnpm install --frozen-lockfile

      - name: Restore Medusa build cache
        timeout-minutes: 1
        id: medusa_build
        uses: actions/cache/restore@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
        with:
          path: ${{ env.MEDUSA_CHECKOUT_PATH }}/apps/backend/.medusa/server
          key: ${{ runner.os }}-medusa-build-${{ env.MEDUSA_REF }}-h0.2.18

      - name: Generate the CI admin password
        timeout-minutes: 1
        run: |
          set -euo pipefail
          pw="$(openssl rand -hex 16)"
          echo "::add-mask::${pw}"
          echo "MEDUSA_ADMIN_PASSWORD=${pw}" >> "$GITHUB_ENV"

      - name: Pull Medusa images (3 tries, 15 s then 30 s)
        id: medusa_pull
        timeout-minutes: 3
        working-directory: ${{ github.workspace }}/p6/node_modules/qa-portfolio-harness/docker
        run: |
          set -euo pipefail
          bash "${{ github.workspace }}/p6/scripts/ci/compose-pull.sh" -p qa-harness-medusa -f medusa.compose.yml

      - name: Start Medusa (harness up)
        timeout-minutes: 3
        id: medusa_up
        if: ${{ steps.medusa_pull.outcome == 'success' }}
        working-directory: ${{ env.P6_WORKING_DIRECTORY }}
        run: |
          set -euo pipefail
          SECONDS=0
          npm run up:medusa
          echo "HARNESS_UP_SECONDS=${SECONDS}" >> "$GITHUB_ENV"
      - name: Spike P6-MED-LOAD-003 and P6-MED-LOAD-010 (characterisation at 150 % of the knee, environment-bound)
        id: spike
        if: ${{ steps.medusa_up.outcome == 'success' }}
        timeout-minutes: 12
        working-directory: ${{ env.P6_WORKING_DIRECTORY }}
        run: |
          set -euo pipefail
          status=0
          npm run load:medusa-spike || status=$?
          if [ "$status" -eq 3 ]; then echo "::warning::spike run INVALID (see the job summary)"; status=0; fi
          exit "$status"

      - name: Job summary (spike table)
        if: ${{ !cancelled() }}
        timeout-minutes: 2
        working-directory: ${{ env.P6_WORKING_DIRECTORY }}
        run: node scripts/write-ci-job-summary.ts

      - name: Token scan of the spike results
        id: token_scan
        if: ${{ !cancelled() }}
        timeout-minutes: 2
        working-directory: ${{ env.P6_WORKING_DIRECTORY }}
        run: node scripts/evidence-token-scan.mjs results/load

      # The release scan (PR #68, .gitleaks.toml) lets the publishable key through only in
      # .../load-medusa/P6-MED-LOAD-nnn/<attempt>/k6-config.json, so the artefact keeps that inner folder.
      - name: Stage the results under load-medusa/
        if: ${{ !cancelled() && steps.token_scan.outcome == 'success' }}
        timeout-minutes: 1
        working-directory: ${{ env.P6_WORKING_DIRECTORY }}
        run: |
          set -euo pipefail
          mkdir -p stage/load-medusa
          cp -a results/load/. stage/load-medusa/

      - uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        if: ${{ !cancelled() && steps.token_scan.outcome == 'success' }}
        timeout-minutes: 3
        with:
          name: spike-medusa
          path: ${{ env.P6_WORKING_DIRECTORY }}/stage/
          if-no-files-found: warn
          retention-days: 90

      - name: Stop Medusa (harness down)
        if: ${{ always() }}
        timeout-minutes: 1
        working-directory: ${{ env.P6_WORKING_DIRECTORY }}
        run: |
          set -euo pipefail
          npm run down:medusa || true
  documenso-limiter:
    name: documenso-limiter
    if: ${{ inputs.mode == 'spike' }}
    runs-on: ubuntu-24.04
    timeout-minutes: 60
    env:
      P6_WORKING_DIRECTORY: p6
      PRODUCTS_ROOT: ${{ github.workspace }}/products
      DOCUMENSO_CHECKOUT_PATH: products/documenso
      DOCUMENSO_BASE_URL: http://127.0.0.1:3001
      # Harness compose's local placeholder credentials. Not a secret.
      DOCUMENSO_DB_URL: postgres://documenso:password@127.0.0.1:5451/documenso
      INBUCKET_BASE_URL: http://127.0.0.1:9003
      P6_WEBHOOK_HOST: p6-webhook.test
      # Test environment: limiters off (harness passes it through), SSRF allowlist for the receiver.
      NEXT_PRIVATE_WEBHOOK_SSRF_BYPASS_HOSTS: p6-webhook.test
      PLAYWRIGHT_SKIP_BROWSER_DOWNLOAD: "1"
    steps:
      # (3) The ref guard, first. Same text as evidence-release.yml; the release requires headBranch main.
      - name: Stop unless dispatched from main
        timeout-minutes: 1
        env:
          DISPATCH_REF: ${{ github.ref }}
        run: |
          set -euo pipefail
          [[ "$DISPATCH_REF" == "refs/heads/main" ]] \
            || { echo "::error::knee runs must be dispatched from main, not from $DISPATCH_REF"; exit 1; }
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        timeout-minutes: 1
        with:
          persist-credentials: false
          path: ${{ env.P6_WORKING_DIRECTORY }}

      - name: Checkout Documenso fork
        timeout-minutes: 1
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          repository: Jayami123/documenso
          ref: ${{ env.DOCUMENSO_REF }}
          path: ${{ env.DOCUMENSO_CHECKOUT_PATH }}
          persist-credentials: false

      - name: Verify Documenso fork HEAD
        timeout-minutes: 1
        run: |
          set -euo pipefail
          head="$(git -C "${DOCUMENSO_CHECKOUT_PATH}" rev-parse HEAD)"
          if [ "$head" != "${DOCUMENSO_REF}" ]; then
            echo "::error::Documenso HEAD ${head} does not match DOCUMENSO_REF ${DOCUMENSO_REF}"
            exit 1
          fi

      - name: Verify DOCUMENSO_REF matches bootstrap.sh
        timeout-minutes: 1
        run: |
          set -euo pipefail
          if ! grep -q "^DOCUMENSO_REF=\"${DOCUMENSO_REF}\"$" "${P6_WORKING_DIRECTORY}/scripts/bootstrap.sh"; then
            echo "::error::DOCUMENSO_REF in perf.yml does not match scripts/bootstrap.sh"
            exit 1
          fi

      # Documenso needs Node 24 (fork engines, harness assert). This job only; the other jobs keep .nvmrc.
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        timeout-minutes: 1
        with:
          node-version: "24.21.0"
          cache: npm
          cache-dependency-path: |
            p6/package-lock.json
            products/documenso/package-lock.json

      - name: Install P6 dependencies
        timeout-minutes: 1
        working-directory: ${{ env.P6_WORKING_DIRECTORY }}
        run: |
          set -euo pipefail
          npm ci

      - name: Install k6 (pinned in .k6-version, checksum-verified)
        timeout-minutes: 2
        run: |
          set -euo pipefail
          bash "${{ github.workspace }}/p6/scripts/install-k6.sh"

      - name: Install Documenso dependencies
        timeout-minutes: 2
        working-directory: ${{ env.DOCUMENSO_CHECKOUT_PATH }}
        run: |
          set -euo pipefail
          npm ci --no-audit --no-fund

      - name: Prepare harness roots
        timeout-minutes: 1
        working-directory: ${{ env.P6_WORKING_DIRECTORY }}
        env:
          BOOTSTRAP_SKIP_INSTALL: "1"
        run: |
          set -euo pipefail
          bash scripts/bootstrap.sh documenso

      - name: Map the webhook host
        timeout-minutes: 1
        run: |
          set -euo pipefail
          echo "127.0.0.1 ${P6_WEBHOOK_HOST}" | sudo tee -a /etc/hosts >/dev/null
          getent hosts "${P6_WEBHOOK_HOST}" | grep -q '^127\.0\.0\.1 '

      - name: Restore Documenso build cache
        timeout-minutes: 1
        id: documenso_build
        uses: actions/cache/restore@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
        with:
          path: ${{ env.DOCUMENSO_CHECKOUT_PATH }}/apps/remix/build
          key: ${{ runner.os }}-documenso-build-${{ env.DOCUMENSO_REF }}-h0.2.18

      - name: Pull Documenso images (3 tries, 15 s then 30 s)
        id: documenso_pull
        timeout-minutes: 3
        working-directory: ${{ github.workspace }}/p6/node_modules/qa-portfolio-harness/docker
        run: |
          set -euo pipefail
          bash "${{ github.workspace }}/p6/scripts/ci/compose-pull.sh" -p qa-harness-documenso -f documenso.compose.yml

      - name: Start Documenso on the production-like limiter profile (D12; harness up)
        id: documenso_up
        if: ${{ steps.documenso_pull.outcome == 'success' }}
        timeout-minutes: 5
        working-directory: ${{ env.P6_WORKING_DIRECTORY }}
        env:
          # A configuration profile, not a workaround: the harness keeps a pre-set value (scripts/harness.mjs uses ||=).
          DANGEROUS_BYPASS_RATE_LIMITS: "false"
        run: |
          set -euo pipefail
          SECONDS=0
          npm run up:documenso
          echo "HARNESS_UP_SECONDS=${SECONDS}" >> "$GITHUB_ENV"

      - name: Limiter contract P6-DOC-LOAD-009
        if: ${{ steps.documenso_up.outcome == 'success' }}
        timeout-minutes: 8
        working-directory: ${{ env.P6_WORKING_DIRECTORY }}
        run: npm run load:documenso-limiter-contract

      # The contract (P6-DOC-LOAD-009) spends the tRPC and v2 windows of the minute. The spike starts after both windows have reset
      # (the limiter is a fixed one-minute window per IP; 70 s covers the reset). Counters are database-backed, so a restart does not clear them.
      - name: Wait for the tRPC and v2 limiter windows to reset
        if: ${{ !cancelled() && steps.documenso_up.outcome == 'success' }}
        timeout-minutes: 3
        run: sleep 70

      - name: Spike P6-DOC-LOAD-004 on the limiter profile
        id: spike
        if: ${{ !cancelled() && steps.documenso_up.outcome == 'success' }}
        timeout-minutes: 9
        working-directory: ${{ env.P6_WORKING_DIRECTORY }}
        run: |
          set -euo pipefail
          status=0
          npm run load:documenso-limiter || status=$?
          if [ "$status" -eq 3 ]; then echo "::warning::spike run INVALID (see the job summary)"; status=0; fi
          exit "$status"

      - name: Job summary (spike table)
        if: ${{ !cancelled() }}
        timeout-minutes: 2
        working-directory: ${{ env.P6_WORKING_DIRECTORY }}
        run: node scripts/write-ci-job-summary.ts

      - name: Token scan of the spike results
        id: token_scan
        if: ${{ !cancelled() }}
        timeout-minutes: 2
        working-directory: ${{ env.P6_WORKING_DIRECTORY }}
        run: node scripts/evidence-token-scan.mjs results/load

      - uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        if: ${{ !cancelled() && steps.token_scan.outcome == 'success' }}
        timeout-minutes: 3
        with:
          name: limiter-documenso
          path: ${{ env.P6_WORKING_DIRECTORY }}/results/load/
          if-no-files-found: warn
          retention-days: 90

      - name: Stop Documenso (harness down)
        if: ${{ always() }}
        timeout-minutes: 1
        working-directory: ${{ env.P6_WORKING_DIRECTORY }}
        run: |
          set -euo pipefail
          npm run down:documenso || true
