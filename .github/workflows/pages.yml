name: pages

on:
  workflow_run:
    workflows: ["evidence-release"]
    types: [completed]
  workflow_dispatch:
  push:
    branches: [main]
    paths:
      - README.md
      - docs/**
      - k6/thresholds/**
      - scripts/dashboard/**
      - src/dashboard/**
      - .github/workflows/pages.yml

permissions:
  contents: read
  actions: read # only for the unreleased-run fallback; the release path needs no actions read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: false

env:
  # Workflow database ids whose successful main runs may be published: perf.yml, knee.yml, soak.yml and gate.yml (as evidence-release.yml).
  EVIDENCE_WORKFLOW_IDS: "376454455 396253729 397232763 398161444"
  GITLEAKS_VERSION: "8.30.1"
  GITLEAKS_SHA256: "551f6fc83ea457d62a0d98237cbad105af8d557003051f41f3e7ca7b3f2470eb"

jobs:
  build:
    name: build the site from the evidence
    runs-on: ubuntu-latest
    timeout-minutes: 20
    # Only main: the release path (workflow_run of a successful evidence-release on main), or a manual dispatch from main.
    if: >-
      (github.event_name == 'workflow_run' && github.event.workflow_run.head_branch == 'main' && github.event.workflow_run.conclusion == 'success') ||
      (github.event_name == 'workflow_dispatch' && github.ref == 'refs/heads/main') ||
      (github.event_name == 'push' && github.ref == 'refs/heads/main')
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        timeout-minutes: 1
        with:
          fetch-depth: 0 # the ancestry check needs the full history

      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        timeout-minutes: 1
        with:
          node-version-file: .nvmrc

      - name: Collect the run ids the thresholds cite and the published phase 4 release lists
        timeout-minutes: 1
        run: |
          set -euo pipefail
          # The thresholds cite the knee, baseline, tolerance and gate runs. The release notes list every run the
          # p6-phase4 release publishes (soak and invariant runs included), so the site reads those zips too.
          { jq -r '.. | objects | .runIds? // empty | .[]' k6/thresholds/*.json; grep -oE 'actions/runs/[0-9]+' docs/releases/p6-phase4.md | sed 's#actions/runs/##'; } | sort -u > "$RUNNER_TEMP/run-ids.txt"
          [[ -s "$RUNNER_TEMP/run-ids.txt" ]] || { echo "::error::no run ids in k6/thresholds"; exit 1; }
          cat "$RUNNER_TEMP/run-ids.txt"

      - name: Validate each evidence run before it is fetched
        timeout-minutes: 1
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail
          while read -r id; do
            meta=$(gh api "repos/$GITHUB_REPOSITORY/actions/runs/$id")
            conclusion=$(jq -r '.conclusion' <<<"$meta")
            workflow=$(jq -r '.workflow_id' <<<"$meta")
            branch=$(jq -r '.head_branch' <<<"$meta")
            head=$(jq -r '.head_sha' <<<"$meta")
            [[ "$conclusion" == "success" ]] || { echo "::error::run $id conclusion is $conclusion"; exit 1; }
            [[ " $EVIDENCE_WORKFLOW_IDS " == *" $workflow "* ]] || { echo "::error::run $id workflow $workflow is not an evidence workflow"; exit 1; }
            [[ "$branch" == "main" ]] || { echo "::error::run $id branch is $branch, not main"; exit 1; }
            git merge-base --is-ancestor "$head" "$GITHUB_SHA" || { echo "::error::run $id headSha is not an ancestor of this commit"; exit 1; }
          done < "$RUNNER_TEMP/run-ids.txt"

      - name: List the p6 releases and plan where each cited run is
        timeout-minutes: 1
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail
          gh api --paginate "repos/$GITHUB_REPOSITORY/releases" --jq '.[]' \
            | jq -s '[.[] | select(.tag_name | startswith("p6-"))]' > "$RUNNER_TEMP/releases.json"
          node scripts/dashboard/plan-release.ts "$RUNNER_TEMP/run-ids.txt" "$RUNNER_TEMP/releases.json" \
            docs/evidence/pending-release.json "$RUNNER_TEMP/plan.json"

      - name: Fetch the planned zips and check each one's sum
        timeout-minutes: 2
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail
          while read -r id tag zip; do
            dir="$RUNNER_TEMP/release/$tag"
            mkdir -p "$dir" "$RUNNER_TEMP/evidence/$id"
            gh release download "$tag" --dir "$dir" --pattern 'SHA256SUMS.txt' --pattern "$zip" --clobber
            (cd "$dir" && grep -F " $zip" SHA256SUMS.txt | sha256sum -c -)
            unzip -q "$dir/$zip" -d "$RUNNER_TEMP/evidence/$id"
          done < <(jq -r '.fetch[] | "\(.runId) \(.tag) \(.zip)"' "$RUNNER_TEMP/plan.json")

      - name: Build the site
        timeout-minutes: 1
        run: |
          set -euo pipefail
          sources=()
          while read -r id; do sources+=("$RUNNER_TEMP/evidence/$id=$id"); done < <(jq -r '.fetch[].runId' "$RUNNER_TEMP/plan.json")
          node scripts/dashboard/build-site.ts site --plan "$RUNNER_TEMP/plan.json" "${sources[@]}"

      - uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        if: ${{ !cancelled() }}
        timeout-minutes: 1
        with:
          name: site
          path: site
          retention-days: 90
          if-no-files-found: error

  scan:
    name: scan the built site
    needs: build
    runs-on: ubuntu-latest
    timeout-minutes: 20
    if: >-
      (github.event_name == 'workflow_run' && github.event.workflow_run.head_branch == 'main' && github.event.workflow_run.conclusion == 'success') ||
      (github.event_name == 'workflow_dispatch' && github.ref == 'refs/heads/main') ||
      (github.event_name == 'push' && github.ref == 'refs/heads/main')
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        timeout-minutes: 1

      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        timeout-minutes: 1
        with:
          node-version-file: .nvmrc

      - name: Download the built site
        timeout-minutes: 1
        uses: actions/download-artifact@37930b1c2abaa49bbe596cd826c3c89aef350131 # v7.0.0
        with:
          name: site
          path: site

      - name: Token scan of the site
        if: ${{ !cancelled() }}
        timeout-minutes: 1
        run: node scripts/evidence-token-scan.mjs site

      - name: Install gitleaks (pinned version, pinned sha256)
        if: ${{ !cancelled() }}
        timeout-minutes: 1
        run: |
          set -euo pipefail
          archive="gitleaks_${GITLEAKS_VERSION}_linux_x64.tar.gz"
          curl -sSfL -o "$RUNNER_TEMP/$archive" \
            "https://github.com/gitleaks/gitleaks/releases/download/v${GITLEAKS_VERSION}/$archive"
          echo "${GITLEAKS_SHA256}  $RUNNER_TEMP/$archive" | sha256sum -c -
          tar -xzf "$RUNNER_TEMP/$archive" -C "$RUNNER_TEMP" gitleaks
          sudo install "$RUNNER_TEMP/gitleaks" /usr/local/bin/gitleaks

      - name: gitleaks over the built site
        if: ${{ !cancelled() }}
        timeout-minutes: 1
        run: gitleaks dir site --no-banner --redact --exit-code 1

      - name: Job summary
        if: ${{ !cancelled() }}
        timeout-minutes: 1
        run: echo "token scan and gitleaks over site/" >> "$GITHUB_STEP_SUMMARY"

      - uses: actions/configure-pages@45bfe0192ca1faeb007ade9deae92b16b8254a0d # v6.0.0
        if: ${{ success() && !cancelled() }}
        timeout-minutes: 1

      - uses: actions/upload-pages-artifact@fc324d3547104276b827a68afc52ff2a11cc49c9 # v5.0.0
        if: ${{ success() && !cancelled() }}
        timeout-minutes: 1
        with:
          path: site

  deploy:
    name: deploy to Pages
    needs: scan
    if: success()
    runs-on: ubuntu-latest
    timeout-minutes: 10
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - id: deployment
        uses: actions/deploy-pages@368f82528645a54fb793d4d04e342629a3f51346 # v5.0.1
        timeout-minutes: 5
