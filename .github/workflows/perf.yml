            exit 1
          fi
          echo "PNPM_STORE_PATH=$(pnpm store path --silent)" >> "$GITHUB_ENV"

      - name: Restore pnpm store cache
        id: medusa_pnpm
        uses: actions/cache/restore@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
        with:
          path: ${{ env.PNPM_STORE_PATH }}
          key: ${{ runner.os }}-medusa-pnpm-${{ env.MEDUSA_REF }}-${{ hashFiles(format('{0}/pnpm-lock.yaml', env.MEDUSA_CHECKOUT_PATH)) }}

      - name: Install Medusa dependencies
        working-directory: ${{ env.MEDUSA_CHECKOUT_PATH }}
        run: |
          set -euo pipefail
          pnpm install --frozen-lockfile

      - name: Restore Medusa build cache
        id: medusa_build
        uses: actions/cache/restore@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
        with:
          path: ${{ env.MEDUSA_CHECKOUT_PATH }}/apps/backend/.medusa/server
          key: ${{ runner.os }}-medusa-build-${{ env.MEDUSA_REF }}-h0.2.15

      - name: Generate the CI admin password
        run: |
          set -euo pipefail
          pw="$(openssl rand -hex 16)"
          echo "::add-mask::${pw}"
          echo "MEDUSA_ADMIN_PASSWORD=${pw}" >> "$GITHUB_ENV"

      - name: Pull Medusa images (3 tries, 15 s then 30 s)
        id: medusa_pull
        timeout-minutes: 6
        working-directory: ${{ github.workspace }}/p6/node_modules/qa-portfolio-harness/docker
        run: |
          set -euo pipefail
          bash "${{ github.workspace }}/p6/scripts/ci/compose-pull.sh" -p qa-harness-medusa -f medusa.compose.yml

      - name: Start Medusa (harness up)
        id: medusa_up
        if: ${{ steps.medusa_pull.outcome == 'success' }}
        working-directory: ${{ env.P6_WORKING_DIRECTORY }}
        run: |
          set -euo pipefail
          SECONDS=0
          npm run up:medusa
          echo "HARNESS_UP_SECONDS=${SECONDS}" >> "$GITHUB_ENV"

      # Plan §12 at 50 trials: 61 attempts per case (50 + 1 warm-up + 10 reruns) x 15.9 s + 6 s setup, two cases
      # = 32 min 32 s worst case. Roadmap D2: 3 trials on PRs, 50 on main, nightly and workflow_dispatch.
      - name: Race medusa budget (P6-MED-RACE-005, -012)
        if: ${{ steps.medusa_up.outcome == 'success' }}
        working-directory: ${{ env.P6_WORKING_DIRECTORY }}
        timeout-minutes: ${{ github.event_name == 'pull_request' && 10 || 40 }}
        env:
          RACE_TRIALS: ${{ github.event_name == 'pull_request' && '3' || '50' }}
          P6_PLAYWRIGHT_JSON: results/playwright/medusa-budget-races.json
        run: |
          set -euo pipefail
          npm run race:medusa -- --grep "P6-MED-RACE-0(05|12)"

      - name: Job summary (Playwright results, race table)
        if: ${{ !cancelled() }}
        working-directory: ${{ env.P6_WORKING_DIRECTORY }}
        run: |
          set -euo pipefail
          node scripts/write-ci-job-summary.ts

      - uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        if: ${{ !cancelled() && steps.medusa_up.outcome == 'success' }}
        with:
          name: race-histograms-medusa-budget
          path: ${{ env.P6_WORKING_DIRECTORY }}/results/races/
          if-no-files-found: warn
          retention-days: 14

      - name: Stop Medusa (harness down)
        if: ${{ always() }}
        working-directory: ${{ env.P6_WORKING_DIRECTORY }}
        run: |
          set -euo pipefail
          npm run down:medusa || true

  # Task 3b (plan §16, owner-agreed 2026-10-23): P6-MED-RACE-013 and -014 run here, not in medusa-smoke.
  # Time budget at 50 trials (plan §16.2): 51 attempts per case expected, 61 at most (1 warm-up + 50 + 10 reruns);
  # per attempt 3.2 s (-013) and 3.5 s (-014), setup included (cloud probe means, an estimate until the first CI run).
  # Race step: 5 min 42 s expected, 6 min 49 s worst. Job: about 8 min 8 s expected, 9 min 15 s worst, with the
  # 1 min 26 s measured before the race step on medusa-smoke and an estimated 1 min after it. Job timeout 30 min
  # leaves 20 min of margin; the race step's 20 min timeout puts its 80 % stop rule at 16 min.
  medusa-load:
    name: medusa-load
    runs-on: ubuntu-24.04
    timeout-minutes: 45
    env:
      P6_WORKING_DIRECTORY: p6
      PRODUCTS_ROOT: ${{ github.workspace }}/products
      MEDUSA_CHECKOUT_PATH: products/medusa-dtc-starter
      MEDUSA_BASE_URL: http://127.0.0.1:9000
      # Public harness default database URL, not a secret.
      MEDUSA_DB_URL: postgres://medusa:medusa@127.0.0.1:5433/medusa
      MEDUSA_ADMIN_EMAIL: admin@qa.local
      MEDUSA_SKIP_STOREFRONT: "1"
      PLAYWRIGHT_SKIP_BROWSER_DOWNLOAD: "1"
      COREPACK_ENABLE_STRICT: "0"
    # Plan D60/D66: -005 and -012 (10 ready carts per attempt) run here so medusa-smoke keeps its time margin.
    # Same pins as medusa-smoke; caches are restored, never saved (medusa-smoke saves them).
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
          path: ${{ env.P6_WORKING_DIRECTORY }}

      - name: Checkout Medusa fork
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          repository: Jayami123/medusa-dtc-starter
          ref: ${{ env.MEDUSA_REF }}
          path: ${{ env.MEDUSA_CHECKOUT_PATH }}
          persist-credentials: false

      - name: Verify Medusa fork HEAD
        run: |
          set -euo pipefail
          head="$(git -C "${MEDUSA_CHECKOUT_PATH}" rev-parse HEAD)"
          if [ "$head" != "${MEDUSA_REF}" ]; then
            echo "::error::Medusa HEAD ${head} does not match MEDUSA_REF ${MEDUSA_REF}"
            exit 1
          fi

      - name: Stub harness product roots
        run: |
          set -euo pipefail
          mkdir -p "${PRODUCTS_ROOT}/cal" "${PRODUCTS_ROOT}/documenso" "${PRODUCTS_ROOT}/twenty-CRM"

      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version-file: ${{ env.P6_WORKING_DIRECTORY }}/.nvmrc
          cache: npm
          cache-dependency-path: ${{ env.P6_WORKING_DIRECTORY }}/package-lock.json

      - name: Install P6 dependencies
        working-directory: ${{ env.P6_WORKING_DIRECTORY }}
        run: |
          set -euo pipefail
          npm ci

      - name: Install k6 (pinned in .k6-version, checksum-verified)
        timeout-minutes: 2
        run: |
          set -euo pipefail
          bash "${{ github.workspace }}/p6/scripts/install-k6.sh"

      - name: Enable pnpm via corepack
        run: |
          set -euo pipefail
          corepack enable
          corepack prepare pnpm@10.11.1 --activate
          version="$(pnpm --version)"
          if [ "$version" != "10.11.1" ]; then
            echo "::error::pnpm ${version} is not the 10.11.1 the Medusa fork pins"
            exit 1
          fi
          echo "PNPM_STORE_PATH=$(pnpm store path --silent)" >> "$GITHUB_ENV"

      - name: Restore pnpm store cache
        id: medusa_pnpm
        uses: actions/cache/restore@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
        with:
          path: ${{ env.PNPM_STORE_PATH }}
          key: ${{ runner.os }}-medusa-pnpm-${{ env.MEDUSA_REF }}-${{ hashFiles(format('{0}/pnpm-lock.yaml', env.MEDUSA_CHECKOUT_PATH)) }}

      - name: Install Medusa dependencies
        working-directory: ${{ env.MEDUSA_CHECKOUT_PATH }}
        run: |
          set -euo pipefail
          pnpm install --frozen-lockfile

      - name: Restore Medusa build cache
        id: medusa_build
        uses: actions/cache/restore@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
        with:
          path: ${{ env.MEDUSA_CHECKOUT_PATH }}/apps/backend/.medusa/server
          key: ${{ runner.os }}-medusa-build-${{ env.MEDUSA_REF }}-h0.2.15

      - name: Generate the CI admin password
        run: |
          set -euo pipefail
          pw="$(openssl rand -hex 16)"
          echo "::add-mask::${pw}"
          echo "MEDUSA_ADMIN_PASSWORD=${pw}" >> "$GITHUB_ENV"

      - name: Pull Medusa images (3 tries, 15 s then 30 s)
        id: medusa_pull
        timeout-minutes: 6
        working-directory: ${{ github.workspace }}/p6/node_modules/qa-portfolio-harness/docker
        run: |
          set -euo pipefail
          bash "${{ github.workspace }}/p6/scripts/ci/compose-pull.sh" -p qa-harness-medusa -f medusa.compose.yml

      - name: Start Medusa (harness up)
        id: medusa_up
        if: ${{ steps.medusa_pull.outcome == 'success' }}
        working-directory: ${{ env.P6_WORKING_DIRECTORY }}
        run: |
          set -euo pipefail
          SECONDS=0
          npm run up:medusa
          echo "HARNESS_UP_SECONDS=${SECONDS}" >> "$GITHUB_ENV"

      # Plan §12 at 50 trials: 61 attempts per case (50 + 1 warm-up + 10 reruns) x 15.9 s + 6 s setup, two cases
      # = 32 min 32 s worst case. Roadmap D2: 3 trials on PRs, 50 on main, nightly and workflow_dispatch.

      - name: Job summary (Playwright results, race table)
        if: ${{ !cancelled() }}
        working-directory: ${{ env.P6_WORKING_DIRECTORY }}
        run: |
          set -euo pipefail
          node scripts/write-ci-job-summary.ts

      - name: LOAD journey P6-MED-LOAD-001 (functional load, not capacity)
        if: ${{ !cancelled() && steps.medusa_up.outcome == 'success' && (github.event_name != 'workflow_dispatch' || inputs.medusa_retry_repeats == '') }}
        working-directory: ${{ env.P6_WORKING_DIRECTORY }}
        timeout-minutes: ${{ github.event_name == 'pull_request' && 4 || 6 }}
        run: |
          set -euo pipefail
          status=0
          npm run load:medusa -- --profile "${{ github.event_name == 'pull_request' && 'pr' || 'full' }}" || status=$?
          if [ "$status" -eq 3 ]; then echo "::warning::LOAD run INVALID; excluded from medians (P6-RULE-005)"; status=0; fi
          exit "$status"

      - name: LOAD journey P6-MED-LOAD-002 (inventory conservation, functional load, not capacity)
        if: ${{ !cancelled() && steps.medusa_up.outcome == 'success' && (github.event_name != 'workflow_dispatch' || inputs.medusa_retry_repeats == '') }}
        working-directory: ${{ env.P6_WORKING_DIRECTORY }}
        timeout-minutes: ${{ github.event_name == 'pull_request' && 4 || 6 }}
        run: |
          set -euo pipefail
          status=0
          npm run load:medusa-conservation -- --profile "${{ github.event_name == 'pull_request' && 'pr' || 'full' }}" || status=$?
          if [ "$status" -eq 3 ]; then echo "::warning::LOAD run INVALID; excluded from medians (P6-RULE-005)"; status=0; fi
          exit "$status"

      - name: LOAD journey P6-MED-LOAD-006 (complete retry storm, functional load, not capacity)
        if: ${{ !cancelled() && steps.medusa_up.outcome == 'success' && (github.event_name != 'workflow_dispatch' || inputs.medusa_retry_repeats == '') }}
        working-directory: ${{ env.P6_WORKING_DIRECTORY }}
        timeout-minutes: ${{ github.event_name == 'pull_request' && 4 || 6 }}
        run: |
          set -euo pipefail
          status=0
          npm run load:medusa-retry -- --profile "${{ github.event_name == 'pull_request' && 'pr' || 'full' }}" || status=$?
          if [ "$status" -eq 3 ]; then echo "::warning::LOAD run INVALID; excluded from medians (P6-RULE-005)"; status=0; fi
          exit "$status"

      # Verification only (workflow_dispatch with medusa_retry_repeats): P6-MED-LOAD-006 runs N times, each a fresh run with
      # its own run id. A run that is not PASS (INVALID included) fails the step; no run is excused.
      # Cap 25 min: N x about 1 min (full profile, setup and cleanup included) gives 10 min; 80 % stop at 20 min. The job
      # budget in this mode is 2 + 6 + 2 + 25 = 35 of 45 min, margin 10.
      - name: VERIFY P6-MED-LOAD-006 repeated (dispatch only)
        if: ${{ !cancelled() && steps.medusa_up.outcome == 'success' && github.event_name == 'workflow_dispatch' && inputs.medusa_retry_repeats != '' }}
        working-directory: ${{ env.P6_WORKING_DIRECTORY }}
        timeout-minutes: 25
        env:
          REPEATS: ${{ inputs.medusa_retry_repeats }}
        run: |
          set -euo pipefail
          if ! [[ "$REPEATS" =~ ^([1-9]|10)$ ]]; then
            echo "::error::medusa_retry_repeats must be 1 to 10, got ${REPEATS}"
            exit 1
          fi
          for i in $(seq 1 "$REPEATS"); do
            echo "P6-MED-LOAD-006 repeat ${i} of ${REPEATS}"
            npm run load:medusa-retry -- --profile full || { echo "::error::repeat ${i} did not finish PASS (exit $?)"; exit 1; }
          done
          node scripts/ci/check-retry-repeats.ts results/load/P6-MED-LOAD-006 "$REPEATS"

      - name: Token scan of the LOAD results
        if: ${{ !cancelled() }}
        working-directory: ${{ env.P6_WORKING_DIRECTORY }}
        timeout-minutes: 2
        run: |
          set -euo pipefail
          node scripts/evidence-token-scan.mjs results/load

      - uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        if: ${{ !cancelled() && steps.medusa_up.outcome == 'success' }}
        with:
          name: load-medusa
          path: ${{ env.P6_WORKING_DIRECTORY }}/results/load/
          if-no-files-found: warn
          retention-days: 14

      - name: Stop Medusa (harness down)
        if: ${{ always() }}
        working-directory: ${{ env.P6_WORKING_DIRECTORY }}
        run: |
          set -euo pipefail
          npm run down:medusa || true

  # Task 3b (plan §16, owner-agreed 2026-10-23): P6-MED-RACE-013 and -014 run here, not in medusa-smoke.
  # Time budget at 50 trials (plan §16.2): 51 attempts per case expected, 61 at most (1 warm-up + 50 + 10 reruns);
  # per attempt 3.2 s (-013) and 3.5 s (-014), setup included (cloud probe means, an estimate until the first CI run).
  # Race step: 5 min 42 s expected, 6 min 49 s worst. Job: about 8 min 8 s expected, 9 min 15 s worst, with the
  # 1 min 26 s measured before the race step on medusa-smoke and an estimated 1 min after it. Job timeout 30 min
  # leaves 20 min of margin; the race step's 20 min timeout puts its 80 % stop rule at 16 min.

  medusa-cancel-extras:
    name: medusa-cancel-extras
    runs-on: ubuntu-24.04
    if: ${{ github.event_name != 'workflow_dispatch' || inputs.medusa_retry_repeats == '' }}
    timeout-minutes: 30
    env:
      P6_WORKING_DIRECTORY: p6
      PRODUCTS_ROOT: ${{ github.workspace }}/products
      MEDUSA_CHECKOUT_PATH: products/medusa-dtc-starter
      MEDUSA_BASE_URL: http://127.0.0.1:9000
      # Public harness default database URL, not a secret.
      MEDUSA_DB_URL: postgres://medusa:medusa@127.0.0.1:5433/medusa
      MEDUSA_ADMIN_EMAIL: admin@qa.local
      MEDUSA_SKIP_STOREFRONT: "1"
      PLAYWRIGHT_SKIP_BROWSER_DOWNLOAD: "1"
      COREPACK_ENABLE_STRICT: "0"
    # Same pins as medusa-smoke and medusa-order-races; caches are restored, never saved (medusa-smoke saves them).
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
          path: ${{ env.P6_WORKING_DIRECTORY }}

      - name: Checkout Medusa fork
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          repository: Jayami123/medusa-dtc-starter
          ref: ${{ env.MEDUSA_REF }}
          path: ${{ env.MEDUSA_CHECKOUT_PATH }}
          persist-credentials: false

      - name: Verify Medusa fork HEAD
        run: |
          set -euo pipefail
          head="$(git -C "${MEDUSA_CHECKOUT_PATH}" rev-parse HEAD)"
          if [ "$head" != "${MEDUSA_REF}" ]; then
            echo "::error::Medusa HEAD ${head} does not match MEDUSA_REF ${MEDUSA_REF}"
            exit 1
          fi

      - name: Stub harness product roots
        run: |
          set -euo pipefail
          mkdir -p "${PRODUCTS_ROOT}/cal" "${PRODUCTS_ROOT}/documenso" "${PRODUCTS_ROOT}/twenty-CRM"

      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version-file: ${{ env.P6_WORKING_DIRECTORY }}/.nvmrc
          cache: npm
          cache-dependency-path: ${{ env.P6_WORKING_DIRECTORY }}/package-lock.json

      - name: Install P6 dependencies
        timeout-minutes: 10
        working-directory: ${{ env.P6_WORKING_DIRECTORY }}
        run: |
          set -euo pipefail
          npm ci

      - name: Install k6 (pinned in .k6-version, checksum-verified)
        timeout-minutes: 2
        run: |
          set -euo pipefail
          bash "${{ github.workspace }}/p6/scripts/install-k6.sh"

      - name: Enable pnpm via corepack
        run: |
          set -euo pipefail
          corepack enable
          corepack prepare pnpm@10.11.1 --activate
          version="$(pnpm --version)"
          if [ "$version" != "10.11.1" ]; then
            echo "::error::pnpm ${version} is not the 10.11.1 the Medusa fork pins"
            exit 1
          fi
          echo "PNPM_STORE_PATH=$(pnpm store path --silent)" >> "$GITHUB_ENV"

      - name: Restore pnpm store cache
        id: medusa_pnpm
        uses: actions/cache/restore@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
        with:
          path: ${{ env.PNPM_STORE_PATH }}
          key: ${{ runner.os }}-medusa-pnpm-${{ env.MEDUSA_REF }}-${{ hashFiles(format('{0}/pnpm-lock.yaml', env.MEDUSA_CHECKOUT_PATH)) }}

      - name: Install Medusa dependencies
        timeout-minutes: 15
        working-directory: ${{ env.MEDUSA_CHECKOUT_PATH }}
        run: |
          set -euo pipefail
          pnpm install --frozen-lockfile

      - name: Restore Medusa build cache
        id: medusa_build
        uses: actions/cache/restore@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
        with:
          path: ${{ env.MEDUSA_CHECKOUT_PATH }}/apps/backend/.medusa/server
          key: ${{ runner.os }}-medusa-build-${{ env.MEDUSA_REF }}-h0.2.15

      - name: Generate the CI admin password
        run: |
          set -euo pipefail
          pw="$(openssl rand -hex 16)"
          echo "::add-mask::${pw}"
          echo "MEDUSA_ADMIN_PASSWORD=${pw}" >> "$GITHUB_ENV"

      - name: Pull Medusa images (3 tries, 15 s then 30 s)
        id: medusa_pull
        timeout-minutes: 6
        working-directory: ${{ github.workspace }}/p6/node_modules/qa-portfolio-harness/docker
        run: |
          set -euo pipefail
          bash "${{ github.workspace }}/p6/scripts/ci/compose-pull.sh" -p qa-harness-medusa -f medusa.compose.yml

      - name: Start Medusa (harness up)
        id: medusa_up
        if: ${{ steps.medusa_pull.outcome == 'success' }}
        timeout-minutes: 10
        working-directory: ${{ env.P6_WORKING_DIRECTORY }}
        run: |
          set -euo pipefail
          SECONDS=0
          npm run up:medusa
          echo "HARNESS_UP_SECONDS=${SECONDS}" >> "$GITHUB_ENV"

      # Expected 5 min 42 s, worst 6 min 49 s at 50 trials (plan §16.2). 3 trials on PRs, 50 on main, nightly and
      # workflow_dispatch. The step timeout is 20 min (stop rule 16 min); a PR run is capped at 10 min.
      - name: Race medusa cancel extras (P6-MED-RACE-013, -014)
        if: ${{ steps.medusa_up.outcome == 'success' }}
        working-directory: ${{ env.P6_WORKING_DIRECTORY }}
        timeout-minutes: ${{ github.event_name == 'pull_request' && 10 || 20 }}
        env:
          RACE_TRIALS: ${{ github.event_name == 'pull_request' && '3' || '50' }}
          P6_PLAYWRIGHT_JSON: results/playwright/medusa-cancel-extras.json
        run: |
          set -euo pipefail
          npm run race:medusa -- --grep "P6-MED-RACE-01(3|4)"

      - name: Job summary (Playwright results, race table)
        if: ${{ !cancelled() }}
        timeout-minutes: 5
        working-directory: ${{ env.P6_WORKING_DIRECTORY }}
        run: |
          set -euo pipefail
          node scripts/write-ci-job-summary.ts

      - uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        if: ${{ !cancelled() && steps.medusa_up.outcome == 'success' }}
        with:
          name: race-histograms-medusa-cancel-extras
          path: ${{ env.P6_WORKING_DIRECTORY }}/results/races/
          if-no-files-found: warn
          retention-days: 14

      - name: Stop Medusa (harness down)
        if: ${{ always() }}
        timeout-minutes: 5
        working-directory: ${{ env.P6_WORKING_DIRECTORY }}
        run: |
          set -euo pipefail
          npm run down:medusa || true

  # P6-MED-RACE-002 and -003 (Phase 3 Task 2): two Medusa backends on one database. The matrix leg picks the lock.
  # Every step has a timeout-minutes; the race step takes its trial count from the matrix on pull requests.
  medusa-multi-instance:
    name: medusa-multi-instance (${{ matrix.lock }})
    runs-on: ubuntu-24.04
    if: ${{ github.event_name != 'workflow_dispatch' || inputs.medusa_retry_repeats == '' }}
    timeout-minutes: 45
    strategy:
      fail-fast: false
      matrix:
        include:
          - { lock: redis, case: P6-MED-RACE-002, pr_trials: "3" }
          - { lock: memory, case: P6-MED-RACE-003, pr_trials: "8" }
    env:
      P6_WORKING_DIRECTORY: p6
      PRODUCTS_ROOT: ${{ github.workspace }}/products
      MEDUSA_CHECKOUT_PATH: products/medusa-dtc-starter
      MEDUSA_BASE_URL: http://127.0.0.1:9000
      MEDUSA_SECOND_BASE_URL: http://127.0.0.1:9001
      MEDUSA_REDIS: "1"
      MEDUSA_LOCK: ${{ matrix.lock }}
      # Public harness default database URL, not a secret.
      MEDUSA_DB_URL: postgres://medusa:medusa@127.0.0.1:5433/medusa
      MEDUSA_ADMIN_EMAIL: admin@qa.local
      MEDUSA_SKIP_STOREFRONT: "1"
      PLAYWRIGHT_SKIP_BROWSER_DOWNLOAD: "1"
      COREPACK_ENABLE_STRICT: "0"
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        timeout-minutes: 2
        with:
          persist-credentials: false
          path: ${{ env.P6_WORKING_DIRECTORY }}

      - name: Checkout Medusa fork
        timeout-minutes: 6
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          repository: Jayami123/medusa-dtc-starter
          ref: ${{ env.MEDUSA_REF }}
          path: ${{ env.MEDUSA_CHECKOUT_PATH }}
          persist-credentials: false

      - name: Verify Medusa fork HEAD
        timeout-minutes: 1
        run: |
          set -euo pipefail
          head="$(git -C "${MEDUSA_CHECKOUT_PATH}" rev-parse HEAD)"
          if [ "$head" != "${MEDUSA_REF}" ]; then
            echo "::error::Medusa HEAD ${head} does not match MEDUSA_REF ${MEDUSA_REF}"
            exit 1
          fi

      - name: Stub harness product roots
        timeout-minutes: 1
        run: |
          set -euo pipefail
          mkdir -p "${PRODUCTS_ROOT}/cal" "${PRODUCTS_ROOT}/documenso" "${PRODUCTS_ROOT}/twenty-CRM"

      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        timeout-minutes: 3
        with:
          node-version-file: ${{ env.P6_WORKING_DIRECTORY }}/.nvmrc
          cache: npm
          cache-dependency-path: ${{ env.P6_WORKING_DIRECTORY }}/package-lock.json

      - name: Install P6 dependencies
        timeout-minutes: 5
        working-directory: ${{ env.P6_WORKING_DIRECTORY }}
        run: |
          set -euo pipefail
          npm ci

      - name: Enable pnpm via corepack
        timeout-minutes: 2
        run: |
          set -euo pipefail
          corepack enable
          corepack prepare pnpm@10.11.1 --activate
          version="$(pnpm --version)"
          if [ "$version" != "10.11.1" ]; then
            echo "::error::pnpm ${version} is not the 10.11.1 the Medusa fork pins"
            exit 1
          fi
          echo "PNPM_STORE_PATH=$(pnpm store path --silent)" >> "$GITHUB_ENV"

      - name: Restore pnpm store cache
        id: medusa_pnpm
        timeout-minutes: 3
        uses: actions/cache/restore@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
        with:
          path: ${{ env.PNPM_STORE_PATH }}
          key: ${{ runner.os }}-medusa-pnpm-${{ env.MEDUSA_REF }}-${{ hashFiles(format('{0}/pnpm-lock.yaml', env.MEDUSA_CHECKOUT_PATH)) }}

      - name: Install Medusa dependencies
        timeout-minutes: 8
        working-directory: ${{ env.MEDUSA_CHECKOUT_PATH }}
        run: |
          set -euo pipefail
          pnpm install --frozen-lockfile

      # Restore only: medusa-smoke saves the build cache, this job never does.
      - name: Restore Medusa build cache
        id: medusa_build
        timeout-minutes: 3
        uses: actions/cache/restore@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
        with:
          path: ${{ env.MEDUSA_CHECKOUT_PATH }}/apps/backend/.medusa/server
          key: ${{ runner.os }}-medusa-build-${{ env.MEDUSA_REF }}-h0.2.15

      - name: Generate the CI admin password
        timeout-minutes: 1
        run: |
          set -euo pipefail
          pw="$(openssl rand -hex 16)"
          echo "::add-mask::${pw}"
          echo "MEDUSA_ADMIN_PASSWORD=${pw}" >> "$GITHUB_ENV"

      - name: Pull Medusa images (3 tries, 15 s then 30 s)
        id: medusa_pull
        timeout-minutes: 6
        working-directory: ${{ github.workspace }}/p6/node_modules/qa-portfolio-harness/docker
        run: |
          set -euo pipefail
          bash "${{ github.workspace }}/p6/scripts/ci/compose-pull.sh" -p qa-harness-medusa -f medusa.compose.yml

      - name: Start Medusa (harness up, two backends)
        id: medusa_up
        timeout-minutes: 10
        if: ${{ steps.medusa_pull.outcome == 'success' }}
        working-directory: ${{ env.P6_WORKING_DIRECTORY }}
        run: |
          set -euo pipefail
          SECONDS=0
          npm run up:medusa
          echo "HARNESS_UP_SECONDS=${SECONDS}" >> "$GITHUB_ENV"

      # The harness must have started the second backend with the lock the matrix leg asked for.
      - name: Guard (both backends healthy, lock as configured)
        if: ${{ steps.medusa_up.outcome == 'success' }}
        timeout-minutes: 2
        working-directory: ${{ env.P6_WORKING_DIRECTORY }}
        run: |
          set -euo pipefail
          for url in "${MEDUSA_BASE_URL}" "${MEDUSA_SECOND_BASE_URL}"; do
            curl -fsS -o /dev/null "${url}/health"
          done
          if [ "${MEDUSA_LOCK}" = "redis" ]; then
            pattern='Connection to Redis in "locking-redis" provider established'
          else
            pattern='Using "in-memory" as default'
          fi
          for log in node_modules/qa-portfolio-harness/.harness/medusa-backend.log node_modules/qa-portfolio-harness/.harness/medusa-backend-2.log; do
            grep -q "$pattern" "$log" || { echo "::error::${log} has no ${MEDUSA_LOCK} lock line"; exit 1; }
          done

      # Plan §10.2: 3 trials on PRs (-002) and 8 (-003), 50 on main, nightly and workflow_dispatch (Phase 1 D2).
      - name: Race ${{ matrix.case }} (two Medusa backends, ${{ matrix.lock }} lock)
        if: ${{ steps.medusa_up.outcome == 'success' }}
        working-directory: ${{ env.P6_WORKING_DIRECTORY }}
        timeout-minutes: ${{ github.event_name == 'pull_request' && 10 || 30 }}
        env:
          RACE_TRIALS: ${{ github.event_name == 'pull_request' && matrix.pr_trials || '50' }}
          P6_PLAYWRIGHT_JSON: results/playwright/${{ matrix.case }}.json
        run: |
          set -euo pipefail
          npm run race:medusa -- --grep "${{ matrix.case }}"

      - name: Log memory (both backends, Postgres, Redis)
        if: ${{ !cancelled() && steps.medusa_up.outcome == 'success' }}
        timeout-minutes: 1
        working-directory: ${{ env.P6_WORKING_DIRECTORY }}
        run: |
          free -m
          for f in node_modules/qa-portfolio-harness/.harness/medusa-backend.pid node_modules/qa-portfolio-harness/.harness/medusa-backend-2.pid; do
            if [ -f "$f" ]; then
              grep -E 'VmRSS|VmHWM' "/proc/$(jq -r .pid "$f")/status" || true
            fi
          done
          docker stats --no-stream --format '{{.Name}} {{.MemUsage}}'

      - name: Check artefacts for tokens
        id: token_check
        if: ${{ !cancelled() && steps.medusa_up.outcome == 'success' }}
        timeout-minutes: 2
        working-directory: ${{ env.P6_WORKING_DIRECTORY }}
        run: |
          set -euo pipefail
          mkdir -p results/evidence results/races
          cp -r results/races results/evidence/races
          cp node_modules/qa-portfolio-harness/.harness/medusa-backend.log node_modules/qa-portfolio-harness/.harness/medusa-backend-2.log results/evidence/
          node scripts/evidence-token-scan.mjs results/evidence

      - name: Job summary (Playwright results, race table)
        if: ${{ !cancelled() }}
        timeout-minutes: 2
        working-directory: ${{ env.P6_WORKING_DIRECTORY }}
        run: |
          set -euo pipefail
          node scripts/write-ci-job-summary.ts

      - uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        if: ${{ !cancelled() && steps.token_check.outcome == 'success' }}
        timeout-minutes: 3
        with:
          name: race-histograms-medusa-multi-instance-${{ matrix.lock }}
          path: ${{ env.P6_WORKING_DIRECTORY }}/results/evidence/
          if-no-files-found: warn
          retention-days: 14

      - name: Stop Medusa (harness down)
        if: ${{ always() }}
        timeout-minutes: 3
        working-directory: ${{ env.P6_WORKING_DIRECTORY }}
        run: |
          set -euo pipefail
          npm run down:medusa || true

  cal-smoke:
    name: cal-smoke
    runs-on: ubuntu-24.04
    if: ${{ github.event_name != 'workflow_dispatch' || inputs.medusa_retry_repeats == '' }}
    timeout-minutes: 60
    env:
      P6_WORKING_DIRECTORY: p6
      PRODUCTS_ROOT: ${{ github.workspace }}/products
      CAL_CHECKOUT_PATH: products/cal
      CAL_BASE_URL: http://127.0.0.1:3000
      # Fork trust-auth local DB (no password). Not a secret.
      CAL_DB_URL: postgresql://postgres@127.0.0.1:5450/calendso
      PLAYWRIGHT_SKIP_BROWSER_DOWNLOAD: "1"
      COREPACK_ENABLE_STRICT: "0"
      TURBO_TELEMETRY_DISABLED: "1"
      NEXT_TELEMETRY_DISABLED: "1"
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        timeout-minutes: 1
        with:
          persist-credentials: false
          path: ${{ env.P6_WORKING_DIRECTORY }}

      - name: Checkout Cal fork
        timeout-minutes: 2
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          repository: Jayami123/cal
          ref: ${{ env.CAL_REF }}
          path: ${{ env.CAL_CHECKOUT_PATH }}
          persist-credentials: false

      - name: Verify Cal fork HEAD
        timeout-minutes: 1
        run: |
          set -euo pipefail
          head="$(git -C "${CAL_CHECKOUT_PATH}" rev-parse HEAD)"
          if [ "$head" != "${CAL_REF}" ]; then
            echo "::error::Cal HEAD ${head} does not match CAL_REF ${CAL_REF}"
            exit 1
          fi

      - name: Verify CAL_REF matches bootstrap.sh
        timeout-minutes: 1
        run: |
          set -euo pipefail
          if ! grep -q "^CAL_REF=\"${CAL_REF}\"$" "${P6_WORKING_DIRECTORY}/scripts/bootstrap.sh"; then
            echo "::error::CAL_REF in perf.yml does not match scripts/bootstrap.sh"
            exit 1
          fi

      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        timeout-minutes: 1
        with:
          node-version-file: ${{ env.P6_WORKING_DIRECTORY }}/.nvmrc
          cache: npm
          cache-dependency-path: ${{ env.P6_WORKING_DIRECTORY }}/package-lock.json

      - name: Install P6 dependencies
        timeout-minutes: 1
        working-directory: ${{ env.P6_WORKING_DIRECTORY }}
        run: |
          set -euo pipefail
          npm ci

      - name: Install k6 (pinned in .k6-version, checksum-verified)
        timeout-minutes: 2
        run: |
          set -euo pipefail
          bash "${{ github.workspace }}/p6/scripts/install-k6.sh"

      # Corepack downloads the Yarn the Cal fork pins from repo.yarnpkg.com.
      - name: Enable corepack
        timeout-minutes: 1
        working-directory: ${{ env.CAL_CHECKOUT_PATH }}
        run: |
          set -euo pipefail
          corepack enable
          version="$(yarn --version)"
          if [ "$version" != "4.12.0" ]; then
            echo "::error::yarn ${version} is not the 4.12.0 the Cal fork pins"
            exit 1
          fi

      - name: Restore Cal Yarn cache
        timeout-minutes: 1
        id: cal_yarn
        uses: actions/cache/restore@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
        with:
          path: ${{ env.CAL_CHECKOUT_PATH }}/.yarn/cache
          key: cal-yarn-${{ hashFiles(format('{0}/yarn.lock', env.CAL_CHECKOUT_PATH)) }}

      - name: Restore Cal node_modules cache
        timeout-minutes: 2
        id: cal_nm
        uses: actions/cache/restore@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
        with:
          path: ${{ env.CAL_CHECKOUT_PATH }}/node_modules
          key: ${{ runner.os }}-cal-nm-${{ env.CAL_REF }}-${{ hashFiles(format('{0}/yarn.lock', env.CAL_CHECKOUT_PATH)) }}

      # Always run: the node_modules cache holds only the root folder, not workspace-local
      # node_modules (e.g. a nested React copy). With both caches warm this is a quick link check.
      - name: Install Cal dependencies
        timeout-minutes: 3
        working-directory: ${{ env.CAL_CHECKOUT_PATH }}
        run: |
          set -euo pipefail
          yarn install --immutable

      - name: Generate Cal Prisma client
        timeout-minutes: 1
        working-directory: ${{ env.CAL_CHECKOUT_PATH }}
        run: |
          set -euo pipefail
          yarn workspace @calcom/prisma prisma generate

      - name: Prepare Cal product .env and harness roots
        timeout-minutes: 1
        working-directory: ${{ env.P6_WORKING_DIRECTORY }}
        env:
          BOOTSTRAP_SKIP_INSTALL: "1"
        run: |
          set -euo pipefail
          bash scripts/bootstrap.sh cal

      - name: Restore Cal build cache
        timeout-minutes: 1
        id: cal_build
        uses: actions/cache/restore@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
        with:
          path: ${{ env.CAL_CHECKOUT_PATH }}/apps/web/.next
          key: ${{ runner.os }}-cal-next-${{ env.CAL_REF }}-h0.2.15

      - name: Pull Cal images (3 tries, 15 s then 30 s)
        timeout-minutes: 3
        id: cal_pull
        working-directory: ${{ env.PRODUCTS_ROOT }}/cal/packages/prisma
        run: |
          set -euo pipefail
          bash "${{ github.workspace }}/p6/scripts/ci/compose-pull.sh" -p qa-harness-cal \
            -f "${{ env.PRODUCTS_ROOT }}/cal/packages/prisma/docker-compose.yml" \
            -f "${{ github.workspace }}/p6/node_modules/qa-portfolio-harness/docker/cal.compose.yml"

      - name: Start Cal (harness up)
        timeout-minutes: 6
        id: cal_up
        if: ${{ steps.cal_pull.outcome == 'success' }}
        working-directory: ${{ env.P6_WORKING_DIRECTORY }}
        run: |
          set -euo pipefail
          SECONDS=0
          npm run up:cal
          echo "HARNESS_UP_SECONDS=${SECONDS}" >> "$GITHUB_ENV"

      - name: Race self-test (cal-race, 3 trials)
        timeout-minutes: 1
        if: ${{ steps.cal_up.outcome == 'success' }}
        working-directory: ${{ env.P6_WORKING_DIRECTORY }}
        env:
          RACE_TRIALS: "3"
          P6_PLAYWRIGHT_JSON: results/playwright/cal-self-test.json
        run: |
          set -euo pipefail
          npm run race:cal -- tests/cal/races/cal-self-test.spec.ts

      - name: Race P6-CAL-RACE-001 (cal-race)
        timeout-minutes: ${{ github.event_name == 'pull_request' && 2 || 3 }}
        if: ${{ !cancelled() && steps.cal_up.outcome == 'success' }}
        working-directory: ${{ env.P6_WORKING_DIRECTORY }}
        # Probe: ~1.2 s per trial (max 1.9 s) on a 4 vCPU VM; 50 trials + 6 extra trials ≈ 70 s.
        env:
          # Roadmap D2: about 5 on PRs, the full 50 on main, nightly and manual runs.
          RACE_TRIALS: ${{ github.event_name == 'pull_request' && '5' || '50' }}
          P6_PLAYWRIGHT_JSON: results/playwright/cal-race-001.json
        run: |
          set -euo pipefail
          npm run race:cal -- tests/cal/races/cal-race-001-identical-slot.spec.ts

      - name: Race P6-CAL-RACE-003 (cal-race)
        timeout-minutes: ${{ github.event_name == 'pull_request' && 1 || 2 }}
        if: ${{ !cancelled() && steps.cal_up.outcome == 'success' }}
        working-directory: ${{ env.P6_WORKING_DIRECTORY }}
        # Probe: ~0.4 s per pair trial (max 0.7 s) on a 4 vCPU VM; 30 + 4 trials ≈ 30–45 s on CI.
        env:
          # Same values as the P6-CAL-RACE-001 step; the case caps itself at 30 trials (plan D10).
          RACE_TRIALS: ${{ github.event_name == 'pull_request' && '5' || '50' }}
          P6_PLAYWRIGHT_JSON: results/playwright/cal-race-003.json
        run: |
          set -euo pipefail
          status=0
          npm run race:cal -- tests/cal/races/cal-race-003-overlap.spec.ts || status=$?
          exit "$status"

      - name: LOAD journey P6-CAL-LOAD-001 (functional load, not capacity)
        timeout-minutes: ${{ github.event_name == 'pull_request' && 1 || 2 }}
        if: ${{ !cancelled() && steps.cal_up.outcome == 'success' }}
        working-directory: ${{ env.P6_WORKING_DIRECTORY }}
        run: |
          set -euo pipefail
          status=0
          npm run load:cal -- --profile "${{ github.event_name == 'pull_request' && 'pr' || 'full' }}" || status=$?
          if [ "$status" -eq 3 ]; then echo "::warning::LOAD run INVALID; excluded from medians (P6-RULE-005)"; status=0; fi
          exit "$status"

      - name: LOAD journey P6-CAL-LOAD-007 (retry storm, functional load, not capacity)
        timeout-minutes: ${{ github.event_name == 'pull_request' && 1 || 2 }}
        if: ${{ !cancelled() && steps.cal_up.outcome == 'success' }}
        working-directory: ${{ env.P6_WORKING_DIRECTORY }}
        run: |
          set -euo pipefail
          status=0
          npm run load:cal-retry -- --profile "${{ github.event_name == 'pull_request' && 'pr' || 'full' }}" || status=$?
          if [ "$status" -eq 3 ]; then echo "::warning::LOAD run INVALID; excluded from medians (P6-RULE-005)"; status=0; fi
          exit "$status"

      # Last Cal step of the job: it restores the event type's prior private links (plan task 10 §6.5), and the other Cal steps use the event type.
      - name: LOAD journey P6-CAL-LOAD-009 (private link retry storm, functional load, not capacity)
        timeout-minutes: ${{ github.event_name == 'pull_request' && 1 || 2 }}
        if: ${{ !cancelled() && steps.cal_up.outcome == 'success' }}
        working-directory: ${{ env.P6_WORKING_DIRECTORY }}
        run: |
          set -euo pipefail
          status=0
          npm run load:cal-link-retry -- --profile "${{ github.event_name == 'pull_request' && 'pr' || 'full' }}" || status=$?
          if [ "$status" -eq 3 ]; then echo "::warning::LOAD run INVALID; excluded from medians (P6-RULE-005)"; status=0; fi
          exit "$status"

      - name: Token scan of the LOAD results
        timeout-minutes: 2
        if: ${{ !cancelled() }}
        working-directory: ${{ env.P6_WORKING_DIRECTORY }}
        run: |
          set -euo pipefail
          node scripts/evidence-token-scan.mjs results/load

      - uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        timeout-minutes: 1
        if: ${{ !cancelled() && steps.cal_up.outcome == 'success' }}
        with:
          name: load-cal
          path: ${{ env.P6_WORKING_DIRECTORY }}/results/load/
          if-no-files-found: warn
          retention-days: 14

      - name: Job summary (Playwright results, race table)
        timeout-minutes: 1
        if: ${{ !cancelled() }}
        working-directory: ${{ env.P6_WORKING_DIRECTORY }}
        run: |
          set -euo pipefail
          node scripts/write-ci-job-summary.ts

      - uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        timeout-minutes: 1
        if: ${{ !cancelled() && steps.cal_up.outcome == 'success' }}
        with:
          name: race-histograms-cal
          path: ${{ env.P6_WORKING_DIRECTORY }}/results/races/
          if-no-files-found: warn
          retention-days: 14

      # Cal's web server log (the harness writes it under its package dir): it holds the Prisma code
      # behind every redacted 400, found by the traceId in the response body.
      - uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        timeout-minutes: 1
        if: ${{ always() }}
        with:
          name: cal-web-log
          path: ${{ env.P6_WORKING_DIRECTORY }}/node_modules/qa-portfolio-harness/.harness/cal-web.log
          if-no-files-found: warn
          retention-days: 14

      - name: Stop Cal (harness down)
        timeout-minutes: 1
        if: ${{ always() }}
        working-directory: ${{ env.P6_WORKING_DIRECTORY }}
        run: |
          set -euo pipefail
          npm run down:cal || true

      - name: Save Cal Yarn cache
        timeout-minutes: 1
        if: >-
          ${{ github.event_name == 'push' && github.ref == 'refs/heads/main' && steps.cal_yarn.outputs.cache-hit != 'true' }}
        continue-on-error: true
        uses: actions/cache/save@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
        with:
          path: ${{ env.CAL_CHECKOUT_PATH }}/.yarn/cache
          key: cal-yarn-${{ hashFiles(format('{0}/yarn.lock', env.CAL_CHECKOUT_PATH)) }}

      - name: Save Cal node_modules cache
        timeout-minutes: 1
        if: >-
          ${{ github.event_name == 'push' && github.ref == 'refs/heads/main' && steps.cal_nm.outputs.cache-hit != 'true' }}
        continue-on-error: true
        uses: actions/cache/save@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
        with:
          path: ${{ env.CAL_CHECKOUT_PATH }}/node_modules
          key: ${{ runner.os }}-cal-nm-${{ env.CAL_REF }}-${{ hashFiles(format('{0}/yarn.lock', env.CAL_CHECKOUT_PATH)) }}

      - name: Save Cal build cache
        timeout-minutes: 1
        if: >-
          ${{ github.event_name == 'push' && github.ref == 'refs/heads/main'
          && steps.cal_build.outputs.cache-hit != 'true'
          && hashFiles(format('{0}/apps/web/.next/harness-build.json', env.CAL_CHECKOUT_PATH)) != '' }}
        continue-on-error: true
        uses: actions/cache/save@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
        with:
          path: ${{ env.CAL_CHECKOUT_PATH }}/apps/web/.next
          key: ${{ runner.os }}-cal-next-${{ env.CAL_REF }}-h0.2.15

  cal-state-races:
    name: cal-state-races
    runs-on: ubuntu-24.04
    if: ${{ github.event_name != 'workflow_dispatch' || inputs.medusa_retry_repeats == '' }}
    timeout-minutes: 85
    env:
      P6_WORKING_DIRECTORY: p6
      PRODUCTS_ROOT: ${{ github.workspace }}/products
      CAL_CHECKOUT_PATH: products/cal
      CAL_BASE_URL: http://127.0.0.1:3000
      # Fork trust-auth local DB (no password). Not a secret.
      CAL_DB_URL: postgresql://postgres@127.0.0.1:5450/calendso
      P6_WEBHOOK_HOST: p6-webhook.test
      PLAYWRIGHT_SKIP_BROWSER_DOWNLOAD: "1"
      COREPACK_ENABLE_STRICT: "0"
      TURBO_TELEMETRY_DISABLED: "1"
      NEXT_TELEMETRY_DISABLED: "1"
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
          path: ${{ env.P6_WORKING_DIRECTORY }}

      - name: Checkout Cal fork
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          repository: Jayami123/cal
          ref: ${{ env.CAL_REF }}
          path: ${{ env.CAL_CHECKOUT_PATH }}
          persist-credentials: false

      - name: Verify Cal fork HEAD
        run: |
          set -euo pipefail
          head="$(git -C "${CAL_CHECKOUT_PATH}" rev-parse HEAD)"
          if [ "$head" != "${CAL_REF}" ]; then
            echo "::error::Cal HEAD ${head} does not match CAL_REF ${CAL_REF}"
            exit 1
          fi

      - name: Verify CAL_REF matches bootstrap.sh
        run: |
          set -euo pipefail
          if ! grep -q "^CAL_REF=\"${CAL_REF}\"$" "${P6_WORKING_DIRECTORY}/scripts/bootstrap.sh"; then
            echo "::error::CAL_REF in perf.yml does not match scripts/bootstrap.sh"
            exit 1
          fi

      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version-file: ${{ env.P6_WORKING_DIRECTORY }}/.nvmrc
          cache: npm
          cache-dependency-path: ${{ env.P6_WORKING_DIRECTORY }}/package-lock.json

      - name: Install P6 dependencies
        working-directory: ${{ env.P6_WORKING_DIRECTORY }}
        run: |
          set -euo pipefail
          npm ci

      # Corepack downloads the Yarn the Cal fork pins from repo.yarnpkg.com.
      - name: Enable corepack
        working-directory: ${{ env.CAL_CHECKOUT_PATH }}
        run: |
          set -euo pipefail
          corepack enable
          version="$(yarn --version)"
          if [ "$version" != "4.12.0" ]; then
            echo "::error::yarn ${version} is not the 4.12.0 the Cal fork pins"
            exit 1
          fi

      - name: Restore Cal Yarn cache
        id: cal_yarn
        uses: actions/cache/restore@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
        with:
          path: ${{ env.CAL_CHECKOUT_PATH }}/.yarn/cache
          key: cal-yarn-${{ hashFiles(format('{0}/yarn.lock', env.CAL_CHECKOUT_PATH)) }}

      - name: Restore Cal node_modules cache
        id: cal_nm
        uses: actions/cache/restore@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
        with:
          path: ${{ env.CAL_CHECKOUT_PATH }}/node_modules
          key: ${{ runner.os }}-cal-nm-${{ env.CAL_REF }}-${{ hashFiles(format('{0}/yarn.lock', env.CAL_CHECKOUT_PATH)) }}

      # Always run: the node_modules cache holds only the root folder, not workspace-local
      # node_modules (e.g. a nested React copy). With both caches warm this is a quick link check.
      - name: Install Cal dependencies
        working-directory: ${{ env.CAL_CHECKOUT_PATH }}
        run: |
          set -euo pipefail
          yarn install --immutable

      - name: Generate Cal Prisma client
        working-directory: ${{ env.CAL_CHECKOUT_PATH }}
        run: |
          set -euo pipefail
          yarn workspace @calcom/prisma prisma generate

      - name: Prepare Cal product .env and harness roots
        working-directory: ${{ env.P6_WORKING_DIRECTORY }}
        env:
          BOOTSTRAP_SKIP_INSTALL: "1"
        run: |
          set -euo pipefail
          bash scripts/bootstrap.sh cal

      - name: Restore Cal build cache
        id: cal_build
        uses: actions/cache/restore@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
        with:
          path: ${{ env.CAL_CHECKOUT_PATH }}/apps/web/.next
          key: ${{ runner.os }}-cal-next-${{ env.CAL_REF }}-h0.2.15
      - name: Map the webhook host
        run: |
          set -euo pipefail
          echo "127.0.0.1 ${P6_WEBHOOK_HOST}" | sudo tee -a /etc/hosts >/dev/null
          getent hosts "${P6_WEBHOOK_HOST}" | grep -q '^127\.0\.0\.1 '

      - name: Pull Cal images (3 tries, 15 s then 30 s)
        id: cal_pull
        timeout-minutes: 6
        working-directory: ${{ env.PRODUCTS_ROOT }}/cal/packages/prisma
        run: |
          set -euo pipefail
          bash "${{ github.workspace }}/p6/scripts/ci/compose-pull.sh" -p qa-harness-cal \
            -f "${{ env.PRODUCTS_ROOT }}/cal/packages/prisma/docker-compose.yml" \
            -f "${{ github.workspace }}/p6/node_modules/qa-portfolio-harness/docker/cal.compose.yml"

      - name: Start Cal (harness up)
        id: cal_up
        if: ${{ steps.cal_pull.outcome == 'success' }}
        # 30 min: the harness up returns once Cal is healthy (the cold start is about 3 min); the cap is below the job timeout.
        timeout-minutes: 30
        working-directory: ${{ env.P6_WORKING_DIRECTORY }}
        run: |
          set -euo pipefail
          npm run up:cal

      # Plan D-C11 / O5: 5 trials on PRs, 50 on main, nightly and dispatch. Step timeouts: 5 min PR, 10 min otherwise.
      - name: Race P6-CAL-RACE-006 (cal-race)
        if: ${{ !cancelled() && steps.cal_up.outcome == 'success' }}
        working-directory: ${{ env.P6_WORKING_DIRECTORY }}
        timeout-minutes: ${{ github.event_name == 'pull_request' && 5 || 10 }}
        env:
          RACE_TRIALS: ${{ github.event_name == 'pull_request' && '5' || '50' }}
          P6_PLAYWRIGHT_JSON: results/playwright/cal-race-006.json
        run: |
          set -euo pipefail
          npm run race:cal -- tests/cal/races/cal-race-006-private-link.spec.ts

      - name: Race P6-CAL-RACE-008 (cal-race)
        if: ${{ !cancelled() && steps.cal_up.outcome == 'success' }}
        working-directory: ${{ env.P6_WORKING_DIRECTORY }}
        timeout-minutes: ${{ github.event_name == 'pull_request' && 5 || 10 }}
        env:
          RACE_TRIALS: ${{ github.event_name == 'pull_request' && '5' || '50' }}
          P6_PLAYWRIGHT_JSON: results/playwright/cal-race-008.json
        run: |
          set -euo pipefail
          npm run race:cal -- tests/cal/races/cal-race-008-private-link-cap.spec.ts

      - name: Race P6-CAL-RACE-007 (cal-race)
        if: ${{ !cancelled() && steps.cal_up.outcome == 'success' }}
        working-directory: ${{ env.P6_WORKING_DIRECTORY }}
        timeout-minutes: ${{ github.event_name == 'pull_request' && 5 || 10 }}
        env:
          RACE_TRIALS: ${{ github.event_name == 'pull_request' && '5' || '50' }}
          P6_PLAYWRIGHT_JSON: results/playwright/cal-race-007.json
        run: |
          set -euo pipefail
          npm run race:cal -- tests/cal/races/cal-race-007-confirm-vs-cancel.spec.ts

      - name: Race P6-CAL-RACE-009 (cal-race)
        if: ${{ !cancelled() && steps.cal_up.outcome == 'success' }}
        working-directory: ${{ env.P6_WORKING_DIRECTORY }}
        timeout-minutes: ${{ github.event_name == 'pull_request' && 5 || 10 }}
        env:
          RACE_TRIALS: ${{ github.event_name == 'pull_request' && '5' || '50' }}
          P6_PLAYWRIGHT_JSON: results/playwright/cal-race-009.json
        run: |
          set -euo pipefail
          npm run race:cal -- tests/cal/races/cal-race-009-double-confirm.spec.ts

      - name: Stop Cal (harness down)
        if: ${{ always() }}
        working-directory: ${{ env.P6_WORKING_DIRECTORY }}
        run: |
          set -euo pipefail
          npm run down:cal || true

      - uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        if: ${{ !cancelled() && steps.cal_up.outcome == 'success' }}
        with:
          name: race-histograms-cal-state
          path: ${{ env.P6_WORKING_DIRECTORY }}/results/races/
          if-no-files-found: warn
          retention-days: 14

      - uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        if: ${{ always() }}
        with:
          name: cal-state-web-log
          path: ${{ env.P6_WORKING_DIRECTORY }}/node_modules/qa-portfolio-harness/.harness/cal-web.log
          if-no-files-found: warn
          retention-days: 14

  documenso-smoke:
    name: documenso-smoke
    runs-on: ubuntu-24.04
    if: ${{ github.event_name != 'workflow_dispatch' || inputs.medusa_retry_repeats == '' }}
    timeout-minutes: 45
    env:
      P6_WORKING_DIRECTORY: p6
      PRODUCTS_ROOT: ${{ github.workspace }}/products
      DOCUMENSO_CHECKOUT_PATH: products/documenso
      DOCUMENSO_BASE_URL: http://127.0.0.1:3001
      # Harness compose's local placeholder credentials. Not a secret.
      DOCUMENSO_DB_URL: postgres://documenso:password@127.0.0.1:5451/documenso
      INBUCKET_BASE_URL: http://127.0.0.1:9003
      P6_WEBHOOK_HOST: p6-webhook.test
      # Test environment: limiters off (harness passes it through), SSRF allowlist for the receiver.
      DANGEROUS_BYPASS_RATE_LIMITS: "true"
      NEXT_PRIVATE_WEBHOOK_SSRF_BYPASS_HOSTS: p6-webhook.test
      PLAYWRIGHT_SKIP_BROWSER_DOWNLOAD: "1"
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
          path: ${{ env.P6_WORKING_DIRECTORY }}

      - name: Checkout Documenso fork
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          repository: Jayami123/documenso
          ref: ${{ env.DOCUMENSO_REF }}
          path: ${{ env.DOCUMENSO_CHECKOUT_PATH }}
          persist-credentials: false

      - name: Verify Documenso fork HEAD
        run: |
          set -euo pipefail
          head="$(git -C "${DOCUMENSO_CHECKOUT_PATH}" rev-parse HEAD)"
          if [ "$head" != "${DOCUMENSO_REF}" ]; then
            echo "::error::Documenso HEAD ${head} does not match DOCUMENSO_REF ${DOCUMENSO_REF}"
            exit 1
          fi

      - name: Verify DOCUMENSO_REF matches bootstrap.sh
        run: |
          set -euo pipefail
          if ! grep -q "^DOCUMENSO_REF=\"${DOCUMENSO_REF}\"$" "${P6_WORKING_DIRECTORY}/scripts/bootstrap.sh"; then
            echo "::error::DOCUMENSO_REF in perf.yml does not match scripts/bootstrap.sh"
            exit 1
          fi

      # Documenso needs Node 24 (fork engines, harness assert). This job only; the other jobs keep .nvmrc.
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: "24.21.0"
          cache: npm
          cache-dependency-path: |
            p6/package-lock.json
            products/documenso/package-lock.json

      - name: Install P6 dependencies
        working-directory: ${{ env.P6_WORKING_DIRECTORY }}
        run: |
          set -euo pipefail
          npm ci

      - name: Install k6 (pinned in .k6-version, checksum-verified)
        timeout-minutes: 2
        run: |
          set -euo pipefail
          bash "${{ github.workspace }}/p6/scripts/install-k6.sh"

      - name: Install Documenso dependencies
        working-directory: ${{ env.DOCUMENSO_CHECKOUT_PATH }}
        run: |
          set -euo pipefail
          npm ci --no-audit --no-fund

      - name: Prepare harness roots
        working-directory: ${{ env.P6_WORKING_DIRECTORY }}
        env:
          BOOTSTRAP_SKIP_INSTALL: "1"
        run: |
          set -euo pipefail
          bash scripts/bootstrap.sh documenso

      - name: Map the webhook host
        run: |
          set -euo pipefail
          echo "127.0.0.1 ${P6_WEBHOOK_HOST}" | sudo tee -a /etc/hosts >/dev/null
          getent hosts "${P6_WEBHOOK_HOST}" | grep -q '^127\.0\.0\.1 '

      - name: Restore Documenso build cache
        id: documenso_build
        uses: actions/cache/restore@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
        with:
          path: ${{ env.DOCUMENSO_CHECKOUT_PATH }}/apps/remix/build
          key: ${{ runner.os }}-documenso-build-${{ env.DOCUMENSO_REF }}-h0.2.15

      - name: Pull Documenso images (3 tries, 15 s then 30 s)
        id: documenso_pull
        timeout-minutes: 6
        working-directory: ${{ github.workspace }}/p6/node_modules/qa-portfolio-harness/docker
        run: |
          set -euo pipefail
          bash "${{ github.workspace }}/p6/scripts/ci/compose-pull.sh" -p qa-harness-documenso -f documenso.compose.yml

      - name: Start Documenso (harness up)
        id: documenso_up
        if: ${{ steps.documenso_pull.outcome == 'success' }}
        working-directory: ${{ env.P6_WORKING_DIRECTORY }}
        run: |
          set -euo pipefail
          SECONDS=0
          npm run up:documenso
          echo "HARNESS_UP_SECONDS=${SECONDS}" >> "$GITHUB_ENV"

      - name: Documenso races (documenso-race)
        id: documenso_races
        if: ${{ steps.documenso_up.outcome == 'success' }}
        working-directory: ${{ env.P6_WORKING_DIRECTORY }}
        timeout-minutes: ${{ github.event_name == 'pull_request' && 15 || 30 }}
        env:
          # Plan D22: about 5 trials on PRs, the full count (50) on main, nightly and workflow_dispatch.
          RACE_TRIALS: ${{ github.event_name == 'pull_request' && '5' || '50' }}
          P6_PLAYWRIGHT_JSON: results/playwright/documenso-race.json
        run: |
          set -euo pipefail
          status=0
          npm run race:documenso || status=$?
          exit "$status"

      # Phase 2 Task 5 (P6-OBS-DOC-001): after the races, so a failure here cannot skip them (a step without a status
      # function gets an implicit success()). A failure fails the job directly.
      - name: Documenso sign-in error contract (documenso-api)
        id: documenso_api
        if: ${{ !cancelled() && steps.documenso_up.outcome == 'success' }}
        working-directory: ${{ env.P6_WORKING_DIRECTORY }}
        timeout-minutes: 5
        env:
          P6_PLAYWRIGHT_JSON: results/playwright/documenso-api.json
        run: |
          set -euo pipefail
