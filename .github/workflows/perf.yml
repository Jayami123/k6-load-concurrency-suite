          if ! grep -q "^TWENTY_REF=\"${TWENTY_REF}\"$" scripts/bootstrap.sh; then
            echo "::error::TWENTY_REF in perf.yml does not match scripts/bootstrap.sh"
            exit 1
          fi

      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        timeout-minutes: 5
        with:
          node-version-file: ${{ env.P6_WORKING_DIRECTORY }}/.nvmrc
          cache: npm
          cache-dependency-path: ${{ env.P6_WORKING_DIRECTORY }}/package-lock.json

      - name: Install P6 dependencies
        timeout-minutes: 10
        working-directory: ${{ env.P6_WORKING_DIRECTORY }}
        run: |
          set -euo pipefail
          npm ci

      - name: Prepare harness roots (Twenty fork at TWENTY_REF)
        timeout-minutes: 10
        working-directory: ${{ env.P6_WORKING_DIRECTORY }}
        env:
          BOOTSTRAP_SKIP_INSTALL: "1"
        run: |
          set -euo pipefail
          bash scripts/bootstrap.sh twenty
          head="$(git -C "${PRODUCTS_ROOT}/twenty-CRM" rev-parse HEAD)"
          if [ "$head" != "${TWENTY_REF}" ]; then
            echo "::error::Twenty HEAD ${head} does not match TWENTY_REF ${TWENTY_REF}"
            exit 1
          fi

      - name: Pull Twenty images (3 tries, 15 s then 30 s)
        id: twenty_pull
        timeout-minutes: 6
        working-directory: ${{ env.PRODUCTS_ROOT }}/twenty-CRM/packages/twenty-docker
        env:
          OVERLAY: ${{ github.workspace }}/p6/node_modules/qa-portfolio-harness/docker/twenty.compose.yml
        run: |
          set -euo pipefail
          bash "${{ github.workspace }}/p6/scripts/ci/compose-pull.sh" -p qa-harness-twenty -f docker-compose.yml -f "$OVERLAY"

      - name: Start Twenty (harness up)
        id: twenty_up
        if: ${{ steps.twenty_pull.outcome == 'success' }}
        timeout-minutes: 12
        working-directory: ${{ env.P6_WORKING_DIRECTORY }}
        run: |
          set -euo pipefail
          npm run up:twenty

      - name: Seed Twenty (harness seed)
        id: twenty_seed
        if: ${{ steps.twenty_up.outcome == 'success' }}
        timeout-minutes: 10
        working-directory: ${{ env.P6_WORKING_DIRECTORY }}
        run: |
          set -euo pipefail
          npm run seed:twenty

      - name: Twenty empty-body spec (twenty-tw-obs)
        id: twenty_obs
        if: ${{ !cancelled() && steps.twenty_seed.outcome == 'success' }}
        timeout-minutes: 3
        working-directory: ${{ env.P6_WORKING_DIRECTORY }}
        env:
          P6_PLAYWRIGHT_JSON: results/playwright/twenty-tw-obs.json
        run: |
          set -euo pipefail
          npm run test:twenty-obs

      - name: Capture container logs (before the scan and the down)
        if: ${{ always() && steps.twenty_pull.outcome == 'success' }}
        timeout-minutes: 2
        working-directory: ${{ env.P6_WORKING_DIRECTORY }}
        run: |
          set -euo pipefail
          mkdir -p results/twenty
          docker compose -p qa-harness-twenty -f "${PRODUCTS_ROOT}/twenty-CRM/packages/twenty-docker/docker-compose.yml" \
            -f "${{ github.workspace }}/p6/node_modules/qa-portfolio-harness/docker/twenty.compose.yml" \
            logs --no-color > results/twenty/containers.log

      - name: Check Twenty artefacts for tokens (values, not names)
        id: token_scan
        if: ${{ always() }}
        timeout-minutes: 3
        working-directory: ${{ env.P6_WORKING_DIRECTORY }}
        run: |
          set -euo pipefail
          value='Bearer [A-Za-z0-9._~+/=-]{16,}|eyJ[A-Za-z0-9_-]{10,}\.eyJ[A-Za-z0-9_-]{10,}\.[A-Za-z0-9_-]{10,}|reset-password/[0-9a-f]{64}|passwordResetToken"?[:=] ?"?[0-9a-f]{64}|inviteToken=[0-9a-f]{64}'
          for f in results/twenty/containers.log results/harness/twenty-up.log; do
            [ -f "$f" ] || continue
            if grep -qE "$value" "$f"; then
              echo "::error::${f} contains a token value; not uploading"
              exit 1
            fi
          done
          if [ -d results/races ] && grep -rqE "$value" results/races; then
            echo "::error::race histograms contain a token value; not uploading"
            exit 1
          fi
          # Playwright's JSON config.metadata holds the repo's git diff: scan only suites and errors (Task 5 closeout).
          for f in results/playwright/*.json; do
            [ -f "$f" ] || continue
            results_json=$(jq -c '{suites, errors}' "$f")
            if grep -qE "$value" <<<"$results_json"; then
              echo "::error::$f: test results contain a token value; not uploading"
              exit 1
            fi
          done

      - name: Job summary (Playwright results, race table)
        if: ${{ !cancelled() && steps.token_scan.outcome == 'success' }}
        timeout-minutes: 2
        working-directory: ${{ env.P6_WORKING_DIRECTORY }}
        run: |
          set -euo pipefail
          node scripts/write-ci-job-summary.ts

      - uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        timeout-minutes: 5
        if: ${{ always() && steps.token_scan.outcome == 'success' }}
        with:
          name: twenty-obs-container-log
          path: ${{ env.P6_WORKING_DIRECTORY }}/results/twenty/containers.log
          if-no-files-found: warn
          retention-days: 14

      - name: Stop Twenty (harness down, volumes removed)
        if: ${{ always() }}
        timeout-minutes: 5
        working-directory: ${{ env.P6_WORKING_DIRECTORY }}
        run: |
          set -euo pipefail
          npm run down:twenty

  # P6-X-LOAD-001 (Phase 3 Task 3): the coordinated-omission self-test. Stub only: no product, no harness.
  load-selftest:
    name: load-selftest
    runs-on: ubuntu-24.04
    if: ${{ github.event_name != 'workflow_dispatch' || inputs.medusa_retry_repeats == '' }}
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        timeout-minutes: 2
        with:
          persist-credentials: false

      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        timeout-minutes: 3
        with:
          node-version-file: .nvmrc
          cache: npm

      - name: Install P6 dependencies
        timeout-minutes: 3
        run: npm ci

      - name: Install k6 (pinned in .k6-version, checksum-verified)
        timeout-minutes: 2
        run: bash scripts/install-k6.sh

      - name: Coordinated-omission self-test (P6-X-LOAD-001)
        timeout-minutes: 3
        run: npm run load:selftest

      # Exit 3 is INVALID: the run is shown in the job summary and excluded from medians (P6-RULE-005), so the job stays green (Q1).
      - name: Validity self-test (P6-X-LOAD-004)
        timeout-minutes: 3
        run: |
          set -euo pipefail
          status=0
          npm run load:validity-selftest || status=$?
          if [ "$status" -eq 3 ]; then
            echo "::warning::LOAD run INVALID (see the job summary); it is excluded from medians (P6-RULE-005)"
            status=0
          fi
          exit "$status"

      - name: Job summary (LOAD table)
        if: ${{ !cancelled() }}
        timeout-minutes: 2
        run: node scripts/write-ci-job-summary.ts

      - name: Print runner identity (one-time probe)
        timeout-minutes: 1
        run: |
          env | grep -E '^(ImageOS|ImageVersion|RUNNER_OS|RUNNER_ARCH)=' || true
          nproc
          free -m | sed -n 2p

      - name: Check artefacts for tokens
        id: token_scan
        if: ${{ !cancelled() }}
        timeout-minutes: 1
        run: node scripts/evidence-token-scan.mjs results/load

      - uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        if: ${{ !cancelled() && steps.token_scan.outcome == 'success' }}
        timeout-minutes: 3
        with:
          name: load-selftest
          path: results/load/
          if-no-files-found: warn
          retention-days: 14

  # P6-X-LOAD-002 (telemetry) and P6-X-LOAD-006 (sampler overhead), Phase 3 Task 5. Stub only: no product, no harness.
  load-overhead:
    name: load-overhead
    runs-on: ubuntu-24.04
    if: ${{ github.event_name != 'workflow_dispatch' || inputs.medusa_retry_repeats == '' }}
    timeout-minutes: 25
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        timeout-minutes: 2
        with:
          persist-credentials: false

      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        timeout-minutes: 3
        with:
          node-version-file: .nvmrc
          cache: npm

      - name: Install P6 dependencies
        timeout-minutes: 3
        run: npm ci

      - name: Install k6 (pinned in .k6-version, checksum-verified)
        timeout-minutes: 2
        run: bash scripts/install-k6.sh

      - name: Telemetry self-test (P6-X-LOAD-002)
        timeout-minutes: 3
        run: |
          set -euo pipefail
          status=0
          npm run load:telemetry-selftest || status=$?
          if [ "$status" -eq 3 ]; then
            echo "::warning::LOAD run INVALID (see the job summary); it is excluded from medians (P6-RULE-005)"
            status=0
          fi
          exit "$status"

      - name: Sampler overhead self-test (P6-X-LOAD-006)
        timeout-minutes: 5
        run: |
          set -euo pipefail
          status=0
          npm run load:overhead-selftest || status=$?
          if [ "$status" -eq 3 ]; then
            echo "::warning::LOAD run INVALID (see the job summary); it is excluded from medians (P6-RULE-005)"
            status=0
          fi
          exit "$status"

      - name: Print cgroup kind and runner identity (one-time probe)
        timeout-minutes: 1
        run: |
          stat -fc 'cgroup fs: %T' /sys/fs/cgroup
          env | grep -E '^(ImageOS|ImageVersion)=' || true

      - name: Job summary (LOAD table)
        if: ${{ !cancelled() }}
        timeout-minutes: 2
        run: node scripts/write-ci-job-summary.ts

      - name: Check artefacts for tokens
        id: token_scan
        if: ${{ !cancelled() }}
        timeout-minutes: 1
        run: node scripts/evidence-token-scan.mjs results/load

      - uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        if: ${{ !cancelled() && steps.token_scan.outcome == 'success' }}
        timeout-minutes: 3
        with:
          name: load-overhead
          path: results/load/
          if-no-files-found: warn
          retention-days: 14
