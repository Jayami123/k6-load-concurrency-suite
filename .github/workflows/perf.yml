      - name: k6 smoke (GET /signin, /api/auth/csrf)
        if: ${{ steps.documenso_up.outcome == 'success' }}
        working-directory: ${{ env.P6_WORKING_DIRECTORY }}
        run: |
          set -euo pipefail
          npm run smoke:documenso

      - uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        if: ${{ !cancelled() && steps.documenso_up.outcome == 'success' }}
        with:
          name: k6-summary-documenso-health
          path: ${{ env.P6_WORKING_DIRECTORY }}/results/documenso-health-summary.json
          if-no-files-found: warn
          retention-days: 14

      - name: Documenso races (documenso-race)
        id: documenso_races
        if: ${{ steps.documenso_up.outcome == 'success' }}
        working-directory: ${{ env.P6_WORKING_DIRECTORY }}
        timeout-minutes: ${{ github.event_name == 'pull_request' && 15 || 30 }}
        env:
          # Plan D22: about 5 trials on PRs, the full count (50) on main, nightly and workflow_dispatch.
          RACE_TRIALS: ${{ github.event_name == 'pull_request' && '5' || '50' }}
          P6_PLAYWRIGHT_JSON: results/playwright/documenso-race.json
        run: |
          set -euo pipefail
          status=0
          npm run race:documenso || status=$?
          exit "$status"

      # Phase 2 Task 5 (P6-OBS-DOC-001): after the races, so a failure here cannot skip them (a step without a status
      # function gets an implicit success()). A failure fails the job directly.
      - name: Documenso sign-in error contract (documenso-api)
        id: documenso_api
        if: ${{ !cancelled() && steps.documenso_up.outcome == 'success' }}
        working-directory: ${{ env.P6_WORKING_DIRECTORY }}
        timeout-minutes: 5
        env:
          P6_PLAYWRIGHT_JSON: results/playwright/documenso-api.json
        run: |
          set -euo pipefail
          npm run test:documenso-api

      # Plan D27, risk R7: the web log and the race histograms are scanned before anything is uploaded.
      - name: Check Documenso artefacts for tokens
        id: web_log_check
        if: ${{ always() }}
        working-directory: ${{ env.P6_WORKING_DIRECTORY }}
        run: |
          set -euo pipefail
          pattern='api_[A-Za-z0-9]{8,}|Bearer |sessionId|/verify-email/[A-Za-z0-9_-]+|/sign/[A-Za-z0-9_-]{10,}'
          log=node_modules/qa-portfolio-harness/.harness/documenso-web.log
          if [ -f "$log" ] && grep -qE "$pattern" "$log"; then
            echo "::error::documenso-web.log contains a token pattern; not uploading"
            exit 1
          fi
          if [ -d results/races ] && grep -rqE "$pattern" results/races; then
            echo "::error::race histograms contain a token pattern; not uploading"
            exit 1
          fi
          # Playwright's JSON config.metadata holds the repo's git diff (source text, including these scan patterns), so
          # the scan reads only the test results: suites and errors (titles, assertion labels, codeframes).
          json_pattern='api_[A-Za-z0-9]{8,}|Bearer |sessionId=[^;[:space:]"]{8,}|/verify-email/[A-Za-z0-9_-]+|/sign/[A-Za-z0-9_-]{10,}'
          for f in results/playwright/*.json; do
            [ -f "$f" ] || continue
            results_json=$(jq -c '{suites, errors}' "$f")
            if grep -qE "$json_pattern" <<<"$results_json"; then
              echo "::error::$f: test results contain a token pattern; not uploading"
              exit 1
            fi
          done

      - name: Job summary (Playwright results, race table)
        if: ${{ !cancelled() && steps.web_log_check.outcome == 'success' }}
        working-directory: ${{ env.P6_WORKING_DIRECTORY }}
        run: |
          set -euo pipefail
          node scripts/write-ci-job-summary.ts

      - uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        if: ${{ always() && steps.web_log_check.outcome == 'success' }}
        with:
          name: race-histograms-documenso
          path: ${{ env.P6_WORKING_DIRECTORY }}/results/races/
          if-no-files-found: warn
          retention-days: 14

      - uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        if: ${{ always() && steps.web_log_check.outcome == 'success' }}
        with:
          name: documenso-web-log
          path: ${{ env.P6_WORKING_DIRECTORY }}/node_modules/qa-portfolio-harness/.harness/documenso-web.log
          if-no-files-found: warn
          retention-days: 14

      - name: Stop Documenso (harness down)
        if: ${{ always() }}
        working-directory: ${{ env.P6_WORKING_DIRECTORY }}
        run: |
          set -euo pipefail
          npm run down:documenso || true

      - name: Save Documenso build cache
        if: >-
          ${{ github.event_name == 'push' && github.ref == 'refs/heads/main'
          && steps.documenso_build.outputs.cache-hit != 'true'
          && hashFiles(format('{0}/apps/remix/build/harness-build.json', env.DOCUMENSO_CHECKOUT_PATH)) != '' }}
        continue-on-error: true
        uses: actions/cache/save@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
        with:
          path: ${{ env.DOCUMENSO_CHECKOUT_PATH }}/apps/remix/build
          key: ${{ runner.os }}-documenso-build-${{ env.DOCUMENSO_REF }}-h0.2.11

  twenty-smoke:
    name: twenty-smoke
    runs-on: ubuntu-24.04
    timeout-minutes: 20
    env:
      P6_WORKING_DIRECTORY: p6
      PRODUCTS_ROOT: ${{ github.workspace }}/products
      TWENTY_REF: 7cbdfec6f346b43715bc2056932f4fad5886f733
      TWENTY_IMAGE_TAG: v2.44.0
      TAG: v2.44.0
      TWENTY_BASE_URL: http://127.0.0.1:3002
      # Public harness default database URL (docker/twenty.compose.yml), not a secret.
      P6_TWENTY_DATABASE_URL: postgres://postgres:postgres@127.0.0.1:5434/default
      # Removes the volumes on every run, so no state carries between runs.
      TWENTY_DOWN_VOLUMES: "1"
      PLAYWRIGHT_SKIP_BROWSER_DOWNLOAD: "1"
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        timeout-minutes: 5
        with:
          persist-credentials: false
          path: ${{ env.P6_WORKING_DIRECTORY }}

      - name: Verify TWENTY_REF matches bootstrap.sh
        timeout-minutes: 2
        working-directory: ${{ env.P6_WORKING_DIRECTORY }}
        run: |
          set -euo pipefail
          if ! grep -q "^TWENTY_REF=\"${TWENTY_REF}\"$" scripts/bootstrap.sh; then
            echo "::error::TWENTY_REF in perf.yml does not match scripts/bootstrap.sh"
            exit 1
          fi

      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        timeout-minutes: 5
        with:
          node-version-file: ${{ env.P6_WORKING_DIRECTORY }}/.nvmrc
          cache: npm

      - name: Install P6 dependencies
        timeout-minutes: 10
        working-directory: ${{ env.P6_WORKING_DIRECTORY }}
        run: |
          set -euo pipefail
          npm ci

      - uses: grafana/setup-k6-action@43b9fc21641a76002687994433dd586f56e791b1 # v1.2.2
        timeout-minutes: 5
        with:
          k6-version: ${{ env.K6_VERSION }}

      - name: Prepare harness roots (Twenty fork at TWENTY_REF)
        timeout-minutes: 10
        working-directory: ${{ env.P6_WORKING_DIRECTORY }}
        env:
          BOOTSTRAP_SKIP_INSTALL: "1"
        run: |
          set -euo pipefail
          bash scripts/bootstrap.sh twenty
          head="$(git -C "${PRODUCTS_ROOT}/twenty-CRM" rev-parse HEAD)"
          if [ "$head" != "${TWENTY_REF}" ]; then
            echo "::error::Twenty HEAD ${head} does not match TWENTY_REF ${TWENTY_REF}"
            exit 1
          fi

      - name: Pull Twenty images (3 tries, 15 s then 30 s)
        id: twenty_pull
        timeout-minutes: 14
        working-directory: ${{ env.PRODUCTS_ROOT }}/twenty-CRM/packages/twenty-docker
        env:
          OVERLAY: ${{ github.workspace }}/p6/node_modules/qa-portfolio-harness/docker/twenty.compose.yml
        run: |
          set -euo pipefail
          for attempt in 1 2 3; do
            if timeout 240 docker compose -p qa-harness-twenty -f docker-compose.yml -f "${OVERLAY}" pull; then
              exit 0
            fi
            [ "$attempt" -lt 3 ] || break
            echo "pull attempt ${attempt} failed; retrying"
            sleep $(( attempt == 1 ? 15 : 30 ))
          done
          echo "::error::docker compose pull failed after 3 attempts"
          exit 1

      - name: Start Twenty (harness up)
        id: twenty_up
        if: ${{ steps.twenty_pull.outcome == 'success' }}
        timeout-minutes: 12
        working-directory: ${{ env.P6_WORKING_DIRECTORY }}
        run: |
          set -euo pipefail
          npm run up:twenty

      - name: Seed Twenty (harness seed)
        id: twenty_seed
        if: ${{ steps.twenty_up.outcome == 'success' }}
        timeout-minutes: 10
        working-directory: ${{ env.P6_WORKING_DIRECTORY }}
        run: |
          set -euo pipefail
          npm run seed:twenty

      - name: k6 smoke (GET /healthz)
        if: ${{ steps.twenty_up.outcome == 'success' }}
        timeout-minutes: 3
        working-directory: ${{ env.P6_WORKING_DIRECTORY }}
        run: |
          set -euo pipefail
          npm run smoke:twenty

      - name: Twenty self-test (twenty-race)
        id: twenty_races
        if: ${{ steps.twenty_seed.outcome == 'success' }}
        timeout-minutes: 5
        working-directory: ${{ env.P6_WORKING_DIRECTORY }}
        env:
          # Plan D6: 5 trials on PRs, the full count (50) on main, nightly and workflow_dispatch.
          RACE_TRIALS: ${{ github.event_name == 'pull_request' && '5' || '50' }}
          P6_PLAYWRIGHT_JSON: results/playwright/twenty-race.json
        run: |
          set -euo pipefail
          npm run race:twenty

      - name: Capture container logs (before the scan and the down)
        if: ${{ always() && steps.twenty_pull.outcome == 'success' }}
        timeout-minutes: 2
        working-directory: ${{ env.P6_WORKING_DIRECTORY }}
        run: |
          set -euo pipefail
          mkdir -p results/twenty
          docker compose -p qa-harness-twenty logs --no-color > results/twenty/containers.log 2>&1 || true

      - name: Check Twenty artefacts for tokens (values, not names)
        id: token_scan
        if: ${{ always() }}
        timeout-minutes: 3
        working-directory: ${{ env.P6_WORKING_DIRECTORY }}
        run: |
          set -euo pipefail
          value='Bearer [A-Za-z0-9._~+/=-]{16,}|eyJ[A-Za-z0-9_-]{10,}\.eyJ[A-Za-z0-9_-]{10,}\.[A-Za-z0-9_-]{10,}'
          for f in results/twenty/containers.log results/harness/twenty-up.log; do
            [ -f "$f" ] || continue
            if grep -qE "$value" "$f"; then
              echo "::error::${f} contains a token value; not uploading"
              exit 1
            fi
          done
          if [ -d results/races ] && grep -rqE "$value" results/races; then
            echo "::error::race histograms contain a token value; not uploading"
            exit 1
          fi
          # Playwright's JSON config.metadata holds the repo's git diff: scan only suites and errors (Task 5 closeout).
          for f in results/playwright/*.json; do
            [ -f "$f" ] || continue
            results_json=$(jq -c '{suites, errors}' "$f")
            if grep -qE "$value" <<<"$results_json"; then
              echo "::error::$f: test results contain a token value; not uploading"
              exit 1
            fi
          done

      - name: Job summary (Playwright results, race table)
        if: ${{ !cancelled() && steps.token_scan.outcome == 'success' }}
        timeout-minutes: 2
        working-directory: ${{ env.P6_WORKING_DIRECTORY }}
        run: |
          set -euo pipefail
          node scripts/write-ci-job-summary.ts

      - uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        timeout-minutes: 5
        if: ${{ always() && steps.token_scan.outcome == 'success' }}
        with:
          name: race-histograms-twenty
          path: ${{ env.P6_WORKING_DIRECTORY }}/results/races/
          if-no-files-found: warn
          retention-days: 14

      - uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        timeout-minutes: 5
        if: ${{ always() && steps.token_scan.outcome == 'success' }}
        with:
          name: twenty-container-log
          path: ${{ env.P6_WORKING_DIRECTORY }}/results/twenty/containers.log
          if-no-files-found: warn
          retention-days: 14

      - name: Stop Twenty (harness down, volumes removed)
        if: ${{ always() }}
        timeout-minutes: 5
        working-directory: ${{ env.P6_WORKING_DIRECTORY }}
        run: |
          set -euo pipefail
          npm run down:twenty
