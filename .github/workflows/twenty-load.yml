name: twenty-load
on:
  pull_request:
    paths:
      [
        ".github/workflows/twenty-load.yml",
        "k6/**",
        "src/load/**",
        "src/twenty/**",
        "scripts/load/**",
        "scripts/ci/**",
        "package.json",
        "package-lock.json",
      ]
  push:
    branches: [main]
    paths:
      [
        ".github/workflows/twenty-load.yml",
        "k6/**",
        "src/load/**",
        "src/twenty/**",
        "scripts/load/**",
        "scripts/ci/**",
        "package.json",
        "package-lock.json",
      ]
  workflow_dispatch:
    inputs:
      profile:
        description: "pr or full (dispatches default to full)"
        required: false
        default: full
        type: choice
        options: [full, pr]
      case:
        description: "Case to run (dispatch only)"
        required: false
        default: TW-BG-FOUNDATION
        type: choice
        options: [TW-BG-FOUNDATION]
  schedule:
    - cron: "43 3 * * *" # the one nightly cron (Tasks 4 and 5 use it); Task 6 adds its weekly Saturday line below it
permissions:
  contents: read
concurrency:
  group: twenty-load-${{ github.event_name == 'schedule' && format('schedule-{0}', github.event.schedule) || github.event_name == 'workflow_dispatch' && github.run_id || github.ref }}
  cancel-in-progress: true
jobs:
  # Twenty plan §2.8: the 15 steps and their caps. Job timeout 80 = the sum of the step caps (70) + 10 (rule C3).
  twenty-load-foundation:
    name: twenty-load-foundation
    if: >-
      github.event_name == 'pull_request' || github.event_name == 'push'
      || (github.event_name == 'workflow_dispatch' && inputs.case == 'TW-BG-FOUNDATION')
      || (github.event_name == 'schedule' && github.event.schedule == '43 3 * * *')
    runs-on: ubuntu-24.04
    timeout-minutes: 82
    env:
      P6_WORKING_DIRECTORY: p6
      PRODUCTS_ROOT: ${{ github.workspace }}/products
      TWENTY_REF: 7cbdfec6f346b43715bc2056932f4fad5886f733 # must equal scripts/bootstrap.sh (step 6 checks it)
      TWENTY_IMAGE_TAG: v2.44.0
      TAG: v2.44.0
      TWENTY_BASE_URL: http://127.0.0.1:3002
      # Public harness default database URL (docker/twenty.compose.yml), not a secret.
      P6_TWENTY_DATABASE_URL: postgres://postgres:postgres@127.0.0.1:5434/default
      TWENTY_DOWN_VOLUMES: "1"
      P6_PROFILE: ${{ github.event_name == 'pull_request' && 'pr' || inputs.profile || 'full' }}
      # Functional limiter profile (Twenty plan §6.3): the six values are set on the up step below.
      P6_TWENTY_LIMITER_PROFILE: functional
    steps:
      - name: Check out P6
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        timeout-minutes: 3
        with:
          persist-credentials: false
          path: ${{ env.P6_WORKING_DIRECTORY }}

      - name: Set up Node
        uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        timeout-minutes: 3
        with:
          node-version-file: ${{ env.P6_WORKING_DIRECTORY }}/.nvmrc
          cache: npm
          cache-dependency-path: ${{ env.P6_WORKING_DIRECTORY }}/package-lock.json

      - name: Install P6 dependencies
        timeout-minutes: 5
        working-directory: ${{ env.P6_WORKING_DIRECTORY }}
        run: |
          set -euo pipefail
          npm ci
          echo "K6_PIN=$(tr -d '[:space:]' < .k6-version)" >> "$GITHUB_ENV"

      - name: Set up k6
        uses: grafana/setup-k6-action@43b9fc21641a76002687994433dd586f56e791b1 # v1.2.2
        timeout-minutes: 3
        with:
          k6-version: ${{ env.K6_PIN }}

      - name: Prepare harness roots (Twenty fork at TWENTY_REF)
        timeout-minutes: 3
        working-directory: ${{ env.P6_WORKING_DIRECTORY }}
        env:
          BOOTSTRAP_SKIP_INSTALL: "1"
        run: |
          set -euo pipefail
          bash scripts/bootstrap.sh twenty

      - name: Verify TWENTY_REF matches bootstrap.sh
        timeout-minutes: 1
        working-directory: ${{ env.P6_WORKING_DIRECTORY }}
        run: |
          set -euo pipefail
          if ! grep -q "^TWENTY_REF=\"${TWENTY_REF}\"$" scripts/bootstrap.sh; then
            echo "::error::TWENTY_REF in twenty-load.yml does not match scripts/bootstrap.sh"
            exit 1
          fi
          head="$(git -C "${PRODUCTS_ROOT}/twenty-CRM" rev-parse HEAD)"
          if [ "$head" != "${TWENTY_REF}" ]; then
            echo "::error::Twenty HEAD ${head} does not match TWENTY_REF ${TWENTY_REF}"
            exit 1
          fi

      - name: Pull Twenty images (3 tries, 15 s then 30 s)
        id: twenty_pull
        timeout-minutes: 6
        working-directory: ${{ env.PRODUCTS_ROOT }}/twenty-CRM/packages/twenty-docker
        env:
          OVERLAY: ${{ github.workspace }}/p6/node_modules/qa-portfolio-harness/docker/twenty.compose.yml
        run: |
          set -euo pipefail
          bash "${{ github.workspace }}/p6/scripts/ci/compose-pull.sh" -p qa-harness-twenty -f docker-compose.yml -f "$OVERLAY"

      - name: Start Twenty (harness up, functional limiter profile)
        id: twenty_up
        timeout-minutes: 12
        working-directory: ${{ env.P6_WORKING_DIRECTORY }}
        # The functional values (Twenty plan §6.3) are read by the harness, which writes them into the server and worker
        # environment. src/twenty/limiter-profile.ts must hold the same values (tests/unit/twenty-load-workflow.test.ts).
        env:
          API_RATE_LIMITING_SHORT_TTL_IN_MS: "1000"
          API_RATE_LIMITING_SHORT_LIMIT: "100"
          API_RATE_LIMITING_LONG_TTL_IN_MS: "60000"
          API_RATE_LIMITING_LONG_LIMIT: "3600"
          APPLICATION_API_RATE_LIMITING_TTL_IN_MS: "60000"
          APPLICATION_API_RATE_LIMITING_LIMIT: "500"
        run: |
          set -euo pipefail
          npm run up:twenty

      - name: Verify the functional limiter env in the server (read-only printenv)
        if: ${{ steps.twenty_up.outcome == 'success' }}
        timeout-minutes: 2
        working-directory: ${{ env.P6_WORKING_DIRECTORY }}
        env:
          API_RATE_LIMITING_SHORT_TTL_IN_MS: "1000"
          API_RATE_LIMITING_SHORT_LIMIT: "100"
          API_RATE_LIMITING_LONG_TTL_IN_MS: "60000"
          API_RATE_LIMITING_LONG_LIMIT: "3600"
          APPLICATION_API_RATE_LIMITING_TTL_IN_MS: "60000"
          APPLICATION_API_RATE_LIMITING_LIMIT: "500"
        run: |
          set -euo pipefail
          # Exact names only (no prefix match): each must equal the functional value inside the server container (ENV on mismatch).
          for name in API_RATE_LIMITING_SHORT_TTL_IN_MS API_RATE_LIMITING_SHORT_LIMIT API_RATE_LIMITING_LONG_TTL_IN_MS API_RATE_LIMITING_LONG_LIMIT APPLICATION_API_RATE_LIMITING_TTL_IN_MS APPLICATION_API_RATE_LIMITING_LIMIT; do
            want="${!name}"
            got="$(docker exec qa-harness-twenty-server-1 printenv "$name" || true)"
            if [ "$got" != "$want" ]; then
              echo "::error::ENV: ${name} in the server is '${got}', expected '${want}'"
              exit 1
            fi
            echo "${name}=${got}"
          done

      - name: Seed Twenty (harness seed)
        id: twenty_seed
        if: ${{ steps.twenty_up.outcome == 'success' }}
        timeout-minutes: 10
        working-directory: ${{ env.P6_WORKING_DIRECTORY }}
        run: |
          set -euo pipefail
          npm run seed:twenty

      - name: k6 smoke (GET /healthz)
        if: ${{ steps.twenty_seed.outcome == 'success' }}
        timeout-minutes: 2
        working-directory: ${{ env.P6_WORKING_DIRECTORY }}
        run: |
          set -euo pipefail
          npm run smoke:twenty

      - name: LOAD run (TW-BG-FOUNDATION)
        id: load
        if: ${{ steps.twenty_seed.outcome == 'success' }}
        timeout-minutes: 10
        working-directory: ${{ env.P6_WORKING_DIRECTORY }}
        run: |
          set -euo pipefail
          node scripts/load/run-load.ts --case TW-BG-FOUNDATION --profile "$P6_PROFILE"

      - name: Check Twenty artefacts for tokens (values, not names)
        id: token_scan
        if: ${{ always() }}
        timeout-minutes: 2
        working-directory: ${{ env.P6_WORKING_DIRECTORY }}
        run: |
          set -euo pipefail
          value='Bearer [A-Za-z0-9._~+/=-]{16,}|eyJ[A-Za-z0-9_-]{10,}\.eyJ[A-Za-z0-9_-]{10,}\.[A-Za-z0-9_-]{10,}'
          for f in results/load results/twenty; do
            [ -e "$f" ] || continue
            if grep -rqE "$value" "$f"; then
              echo "::error::${f} contains a token value; not uploading"
              exit 1
            fi
          done

      - name: Upload LOAD results
        if: ${{ always() && steps.token_scan.outcome == 'success' }}
        timeout-minutes: 3
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: twenty-load-foundation
          path: ${{ env.P6_WORKING_DIRECTORY }}/results/load/
          retention-days: 14
          if-no-files-found: warn

      - name: Capture container logs (before the scan and the down)
        if: ${{ always() && steps.twenty_pull.outcome == 'success' }}
        timeout-minutes: 2
        working-directory: ${{ env.P6_WORKING_DIRECTORY }}
        run: |
          set -euo pipefail
          mkdir -p results/twenty
          docker compose -p qa-harness-twenty -f "${PRODUCTS_ROOT}/twenty-CRM/packages/twenty-docker/docker-compose.yml" \
            -f "${{ github.workspace }}/p6/node_modules/qa-portfolio-harness/docker/twenty.compose.yml" \
            logs --no-color > results/twenty/containers.log

      - name: Stop Twenty (harness down, volumes removed)
        if: ${{ always() }}
        timeout-minutes: 5
        working-directory: ${{ env.P6_WORKING_DIRECTORY }}
        run: |
          set -euo pipefail
          npm run down:twenty

